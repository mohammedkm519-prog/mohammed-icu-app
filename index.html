  const daysText = days.map(d => `Day ${d.dayIndex}${d.isAdmission?' (admission day)':''} (${d.dateLabel}): meds started: ${d.meds.join(', ')||'none'}; vitals BP ${rangeStr(d.bpSysRange)}, HR ${rangeStr(d.hrRange)}, Temp ${rangeStr(d.tempRange)}, SpO2 ${rangeStr(d.spo2Range)}, GCS ${rangeStr(d.gcsRange)}; peak NEWS2: ${d.peakNews2??'n/a'}; rule-based alerts triggered: ${d.alerts.map(a=>a.type+'('+a.level+')').join(', ')||'none'}; labs: ${d.labs.join('; ')||'none'}; fluid balance: ${d.ioBalance!=null?d.ioBalance+'mL':'n/a'}; notes: ${d.notes.join('; ')||'none'}`).join('\n');
  const langName = lang==='ar'?'Arabic':lang==='tr'?'Turkish':lang==='fa'?'Persian':'English';
  return `You are writing ONE short highlight sentence (max 20 words) per ICU day, summarizing notable changes/trends only from the factual data given below. Do NOT diagnose, do NOT suggest treatment, do NOT recommend medication - only describe what the data shows (e.g. "BP improved after starting X", "fever persists"). Write in ${langName}. Patient context: ${p.age}yo ${p.gender}, diagnosis on file: ${p.diagnosis||'-'}.

${daysText}

Respond with ONLY a raw JSON object, no markdown, in this exact shape: {"narratives": {"0": "...", "1": "...", ...}} using the day numbers as keys. Skip a day only if it truly has no events.`;
}

async function generateSummary(patientId){
  const statusEl = document.getElementById('summaryStatus');
  const cfg = getAiConfig();
  if(!cfg.apiKey){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('noApiKey')}</p>`; return; }
  const db = patientDataCache;
  const p = patientsCache.find(x=>x.id===patientId);
  statusEl.innerHTML = `<p class="muted">${t('summaryLoading')}</p>`;
  try{
    const days = buildDayGroups(p, db);
    const prompt = buildDayNarrativePrompt(days, p);
    const text = await callAiTextOnly(prompt);
    const parsed = parseJsonObjectSafe(text);
    const narratives = parsed.narratives || {};
    days.forEach(d => { d.narrative = narratives[String(d.dayIndex)] || ''; });
    await fbDb.collection('summaries').add({ patientId, days, time: Date.now(), createdBy: currentActor() });
    statusEl.innerHTML = '';
  }catch(err){
    statusEl.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message||'').replace(/</g,'&lt;')}</div>`;
  }
}

/* ---------- التشخيص التمريضي المقترح بالذكاء الاصطناعي (NANDA-I) ----------
   دعم قرار فقط: الممرض هو من يقبل أو يعدّل أو يرفض كل اقتراح، ولا يُرسل اسم المريض
   ولا أي معرّف هوية للنموذج (بيانات سريرية مجهولة الهوية فقط). كل قرار يُسجَّل
   (مقبول / معدّل / مرفوض) لقياس نسبة قبول الاقتراحات في البحث. */
let dxPending = {};   // patientId -> اقتراحات لم يُبتّ فيها بعد
let dxEditing = {};   // 'patientId:index' -> true أثناء التعديل
let dxBusy = false;

function dxScrub(text, p){
  let s = String(text || '');
  String(p.name || '').split(/\s+/).filter(w => w.length >= 3).forEach(w => { s = s.split(w).join('[X]'); });
  return s;
}
function dxAgo(time){ return (Math.round((Date.now() - time) / 360000) / 10) + 'h ago'; }

function buildNursingDxContext(p, db){
  const mine = col => (db[col] || []).filter(x => x.patientId === p.id).sort((a, b) => b.time - a.time);
  const vit = mine('vitals').slice(0, 4);
  if(!vit.length) return null;
  const lines = [];
  lines.push(`Patient: ${p.age || '?'} years, ${p.gender || '?'}. Medical diagnosis: ${dxScrub(p.diagnosis, p) || '-'}. Chronic: ${dxScrub(p.chronic, p) || '-'}. Allergies: ${dxScrub(p.allergies, p) || '-'}. Past history: ${dxScrub(p.pastHistory, p) || '-'}. Home medications: ${dxScrub(p.homeMeds, p) || '-'}.`);
  lines.push('Vital signs (newest first):');
  vit.forEach(v => {
    let news = '';
    try{ news = ', NEWS2 ' + calcNEWS2(v); }catch(e){}
    lines.push(`- ${dxAgo(v.time)}: BP ${v.bp_sys}/${v.bp_dia}, HR ${v.pulse}, Temp ${v.temp}, SpO2 ${v.spo2}%, RR ${v.rr}${v.gcs_total != null ? ', GCS ' + v.gcs_total : ''}${news}`);
  });
  const labs = mine('labs').slice(0, 10);
  if(labs.length){
    lines.push('Latest labs:');
    labs.forEach(l => lines.push(`- ${dxScrub(l.testType, p)}: ${dxScrub(l.value, p)} (${dxAgo(l.time)})`));
  }
  const vent = mine('ventilator')[0];
  if(vent){
    if(vent.event === 'disconnect') lines.push('Ventilator: disconnected (not mechanically ventilated now).');
    else lines.push(`Ventilator: mode ${vent.mode || '-'}, FiO2 ${vent.fio2 ?? '-'}, PEEP ${vent.peep ?? '-'}, Vt ${vent.tidalVolume ?? '-'}, set RR ${vent.setRR ?? '-'}, PIP ${vent.pip ?? '-'}, Pplat ${vent.plateauPressure ?? '-'}${vent.airwayType ? ', airway ' + vent.airwayType : ''}.`);
  }
  const dayAgo = Date.now() - 24 * 3600000;
  const io = mine('io').filter(x => x.time >= dayAgo);
  if(io.length){
    const inMl = io.filter(x => x.direction === 'intake').reduce((s, x) => s + Number(x.amount || 0), 0);
    const outMl = io.filter(x => x.direction === 'output').reduce((s, x) => s + Number(x.amount || 0), 0);
    lines.push(`Intake/output last 24h: intake ${inMl} mL, output ${outMl} mL, balance ${inMl - outMl} mL.`);
  }
  const meds = mine('orders').filter(o => o.status === 'pending').map(o => o.medName).filter(Boolean);
  if(meds.length) lines.push('Active medication orders (names only): ' + meds.join(', ') + '.');
  const notes = mine('notes').slice(0, 3).map(n => '- ' + dxScrub(String(n.text || '').slice(0, 200), p)).filter(x => x.length > 2);
  if(notes.length) lines.push('Recent nursing notes:\n' + notes.join('\n'));
  return lines.join('\n');
}

function buildNursingDxPrompt(p, db){
  const ctx = buildNursingDxContext(p, db);
  if(!ctx) return null;
  const langName = lang === 'ar' ? 'Arabic' : lang === 'tr' ? 'Turkish' : lang === 'fa' ? 'Persian' : 'English';
  return `You are a nursing-informatics assistant supporting an ICU nurse. Based ONLY on the de-identified data below, propose 3 to 5 candidate NANDA-I nursing diagnoses, ranked by priority for the current shift.
Rules:
- Use only the data provided. Never invent values. If the data are insufficient for a diagnosis, do not propose it.
- Nursing diagnoses only (standard NANDA-I labels, for example "Ineffective airway clearance" or "Risk for infection"). Do NOT give medical diagnoses, drug names, doses, or medical orders.
- Every defining characteristic must quote a value or finding that appears in the data.
- Interventions must be nursing actions (monitoring, positioning, hygiene, safety, education, escalation to the physician when criteria are met). Expected outcomes must be measurable (NOC style).
- Write label, relatedFactors, definingCharacteristics, expectedOutcomes, interventions and rationale in ${langName}. Keep labelEn as the standard English NANDA-I label.
- Respond with ONLY a raw JSON object, no markdown, in this exact shape: {"diagnoses":[{"label":"","labelEn":"","urgency":"high|medium|low","relatedFactors":[""],"definingCharacteristics":[""],"expectedOutcomes":[""],"interventions":[""],"rationale":""}]}

DATA:
${ctx}`;
}

function dxCleanList(v){
  return (Array.isArray(v) ? v : []).map(x => String(x || '').trim()).filter(Boolean).slice(0, 6);
}
function dxSanitize(d, i){
  const urg = ['high', 'medium', 'low'].includes(d.urgency) ? d.urgency : 'medium';
  return {
    label: String(d.label || '').trim().slice(0, 160), labelEn: String(d.labelEn || '').trim().slice(0, 160),
    urgency: urg, priority: i + 1,
    relatedFactors: dxCleanList(d.relatedFactors), definingCharacteristics: dxCleanList(d.definingCharacteristics),
    expectedOutcomes: dxCleanList(d.expectedOutcomes), interventions: dxCleanList(d.interventions),
    rationale: String(d.rationale || '').trim().slice(0, 400)
  };
}

async function dxSuggest(pid){
  const statusEl = document.getElementById('dxStatus');
  const btn = document.getElementById('dxSuggestBtn');
  const cfg = getAiConfig();
  if(!cfg.apiKey){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('noApiKey')}</p>`; return; }
  if(dxBusy) return;
  const p = patientsCache.find(x => x.id === pid);
  const prompt = buildNursingDxPrompt(p, patientDataCache);
  if(!prompt){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('dxNoData')}</p>`; return; }
  dxBusy = true; if(btn) btn.disabled = true;
  statusEl.innerHTML = `<p class="muted">${t('dxLoading')}</p>`;
  try{
    const text = await callAiTextOnly(prompt, 2000);
    const parsed = parseJsonObjectSafe(text);
    const arr = (Array.isArray(parsed.diagnoses) ? parsed.diagnoses : []).slice(0, 5).map(dxSanitize).filter(d => d.label);
    if(!arr.length) throw new Error('EMPTY_RESPONSE');
    dxPending[pid] = arr; dxEditing = {};
    render();
  }catch(err){
    const net = /Failed to fetch|NetworkError|Load failed/i.test(err.message || '');
    statusEl.innerHTML = net
      ? `<div class="alert-box">${t('dxNetErr')}</div>`
      : `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message || '').replace(/</g, '&lt;')}</div>`;
  }finally{
    dxBusy = false; if(btn) btn.disabled = false;
  }
}

function dxLinesVal(id){
  const el = document.getElementById(id);
  return el ? el.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8) : [];
}
function dxListHtml(label, arr){
  if(!arr || !arr.length) return '';
  return `<div style="margin-top:8px;"><div class="muted" style="font-size:12.5px;font-weight:600;">${label}</div><ul style="margin:4px 0 0;padding-inline-start:20px;">${arr.map(x => `<li>${String(x).replace(/</g, '&lt;')}</li>`).join('')}</ul></div>`;
}
function dxUrgBadge(u){
  const map = { high: ['crit', 'dxUrgHigh'], medium: ['med', 'dxUrgMed'], low: ['low', 'dxUrgLow'] };
  const m = map[u] || map.medium;
  return `<span class="badge ${m[0]}">${t(m[1])}</span>`;
}
function dxBody(s){
  return `
    ${s.rationale ? `<p class="muted" style="margin:6px 0 0;">${t('dxRationale')}: ${String(s.rationale).replace(/</g, '&lt;')}</p>` : ''}
    ${dxListHtml(t('dxRelated'), s.relatedFactors)}
    ${dxListHtml(t('dxDefining'), s.definingCharacteristics)}
    ${dxListHtml(t('dxOutcomes'), s.expectedOutcomes)}
    ${dxListHtml(t('dxInterventions'), s.interventions)}`;
}
function dxPendingCardHtml(pid, s, i){
  const key = pid + ':' + i;
  if(dxEditing[key]){
    const ta = (id, label, arr) => `<div class="field"><label>${label} <span class="muted">(${t('dxLinesHint')})</span></label><textarea id="${id}_${i}" rows="3">${(arr || []).join('\n').replace(/</g, '&lt;')}</textarea></div>`;
    return `<div class="card">
      <div class="field"><label>${t('dxLabel')}</label><input id="dxe_label_${i}" value="${String(s.label).replace(/"/g, '&quot;')}"></div>
      ${ta('dxe_rel', t('dxRelated'), s.relatedFactors)}
      ${ta('dxe_def', t('dxDefining'), s.definingCharacteristics)}
      ${ta('dxe_out', t('dxOutcomes'), s.expectedOutcomes)}
      ${ta('dxe_int', t('dxInterventions'), s.interventions)}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="dxDecide('${pid}', ${i}, 'edited')"><i class="ti ti-check"></i> ${t('dxSaveEdit')}</button>
        <button class="secondary" onclick="dxToggleEdit('${pid}', ${i}, false)">${t('dxCancel')}</button>
      </div>
      <div id="dxCardErr_${i}"></div>
    </div>`;
  }
  return `<div class="card">
    <div class="flex-between" style="gap:10px;align-items:flex-start;">
      <div><strong>${i + 1}. ${String(s.label).replace(/</g, '&lt;')}</strong>
        ${s.labelEn ? `<div class="muted" style="direction:ltr;text-align:start;font-size:12.5px;">${String(s.labelEn).replace(/</g, '&lt;')}</div>` : ''}</div>
      ${dxUrgBadge(s.urgency)}
    </div>
    ${dxBody(s)}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button onclick="dxDecide('${pid}', ${i}, 'accepted')"><i class="ti ti-check"></i> ${t('dxAccept')}</button>
      <button class="secondary" onclick="dxToggleEdit('${pid}', ${i}, true)"><i class="ti ti-edit"></i> ${t('dxEdit')}</button>
      <button class="secondary" onclick="dxDecide('${pid}', ${i}, 'rejected')"><i class="ti ti-x"></i> ${t('dxReject')}</button>
    </div>
    <div id="dxCardErr_${i}"></div>
  </div>`;
}
function dxToggleEdit(pid, i, on){ dxEditing[pid + ':' + i] = !!on; render(); }

async function dxDecide(pid, i, status){
  const list = dxPending[pid] || [];
  const s = list[i];
  if(!s) return;
  const item = { ...s };
  if(status === 'edited'){
    item.label = (document.getElementById('dxe_label_' + i).value || '').trim() || s.label;
    item.relatedFactors = dxLinesVal('dxe_rel_' + i);
    item.definingCharacteristics = dxLinesVal('dxe_def_' + i);
    item.expectedOutcomes = dxLinesVal('dxe_out_' + i);
    item.interventions = dxLinesVal('dxe_int_' + i);
  }
  const rec = {
    patientId: pid, label: item.label, labelEn: item.labelEn || '', urgency: item.urgency || 'medium', priority: item.priority || (i + 1),
    relatedFactors: item.relatedFactors || [], definingCharacteristics: item.definingCharacteristics || [],
    expectedOutcomes: item.expectedOutcomes || [], interventions: item.interventions || [], rationale: item.rationale || '',
    status, source: 'ai', aiOriginalLabel: s.label, provider: getAiConfig().provider || '', uiLang: lang,
    time: Date.now(), decidedBy: currentActor()
  };
  try{
    await fbDb.collection('nursingDx').add(rec);
    list.splice(i, 1); dxEditing = {};
    render();
  }catch(err){
    const el = document.getElementById('dxCardErr_' + i);
    if(el) el.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message || '').replace(/</g, '&lt;')}</div>`;
  }
}

async function dxSaveManual(pid){
  const label = (document.getElementById('dxm_label').value || '').trim();
  const errEl = document.getElementById('dxManualErr');
  if(!label) return;
  try{
    await fbDb.collection('nursingDx').add({
      patientId: pid, label, labelEn: '', urgency: document.getElementById('dxm_urg').value || 'medium', priority: 0,
      relatedFactors: dxLinesVal('dxm_rel'), definingCharacteristics: [], expectedOutcomes: dxLinesVal('dxm_out'),
      interventions: dxLinesVal('dxm_int'), rationale: '', status: 'accepted', source: 'manual',
      uiLang: lang, time: Date.now(), decidedBy: currentActor()
    });
    render();
  }catch(err){
    errEl.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message || '').replace(/</g, '&lt;')}</div>`;
  }
}
async function dxResolve(docId){
  try{
    await fbDb.collection('nursingDx').doc(docId).update({ status: 'resolved', resolvedAt: Date.now(), resolvedBy: currentActor() });
  }catch(err){ alert(err.message); }
}

let currentNoteRecorder = null, currentNoteAudioBase64 = null;
async function toggleNoteVoiceRecording(){
  const btn = document.getElementById('n_voiceBtn');
  const statusEl = document.getElementById('n_voiceStatus');
  if(currentNoteRecorder && currentNoteRecorder.state === 'recording'){
    currentNoteRecorder.stop();
    return;
  }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(err){ statusEl.textContent = err.message; return; }
  const chunks = [];
  currentNoteRecorder = new MediaRecorder(stream);
  currentNoteRecorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  currentNoteRecorder.onstop = async () => {
    stream.getTracks().forEach(t=>t.stop());
    btn.innerHTML = `<i class="ti ti-microphone-2"></i> ${t('recordVoiceNote')}`;
    try{
      const base64 = await blobToBase64(new Blob(chunks, { type:'audio/webm' }));
      if(base64.length >= 900000){ statusEl.textContent = t('fileSizeWarning'); return; }
      currentNoteAudioBase64 = base64;
      statusEl.innerHTML = `<i class="ti ti-circle-check" style="color:var(--brand);"></i> ${t('voiceNoteAttached')}`;
    }catch(err){ statusEl.textContent = err.message; }
  };
  currentNoteRecorder.start();
  btn.innerHTML = `<i class="ti ti-player-stop-filled" style="color:var(--danger);"></i> ${t('listening')}`;
  statusEl.textContent = '';
}
let currentNoteFileData = null, currentNoteFileName = null, currentNoteFileMime = null;
async function onNoteFileSelected(input){
  const statusEl = document.getElementById('n_fileStatus');
  const file = input.files[0];
  if(!file) return;
  statusEl.textContent = t('extracting');
  try{
    let dataUrl;
    if(file.type.startsWith('image/')){
      const compressed = await compressImageToDataURL(file, 900);
      dataUrl = compressed.dataUrl;
    }else{
      dataUrl = await fileToBase64(file);
    }
    if(dataUrl.length >= 900000){
      statusEl.textContent = t('fileSizeWarning');
      input.value = '';
      return;
    }
    currentNoteFileData = dataUrl;
    currentNoteFileName = file.name;
    currentNoteFileMime = file.type;
    statusEl.innerHTML = `<i class="ti ti-circle-check" style="color:var(--brand);"></i> ${file.name}`;
  }catch(err){
    statusEl.textContent = err.message;
  }
}
async function saveNote(patientId){
  const noteTextForPush = document.getElementById('n_text').value;
  const noteUrgentForPush = document.getElementById('n_urgent').value === '1';
  await fbDb.collection('notes').add({
    patientId, noteType: document.getElementById('n_type').value, text: document.getElementById('n_text').value,
    urgent: document.getElementById('n_urgent').value === '1',
    audioData: currentNoteAudioBase64 || null,
    fileData: currentNoteFileData || null, fileName: currentNoteFileName || null, fileMimeType: currentNoteFileMime || null,
    time: Date.now(), createdBy: currentActor()
  });
  currentNoteAudioBase64 = null;
  currentNoteFileData = null; currentNoteFileName = null; currentNoteFileMime = null;
  const ptn = patientsCache.find(x => x.id === patientId);
  sendPush(ptn, noteUrgentForPush ? t('urgentNotifTitle') : t('newNoteNotifTitle'), (ptn ? ptn.name : '') + ': ' + noteTextForPush.slice(0, 60), 'tabNotes', noteUrgentForPush);
}

function onNoteMicClick(){
  const statusEl = document.getElementById('noteMicStatus');
  startVoiceCapture(currentPatientId, 'notes',
    (transcript) => {
      const textarea = document.getElementById('n_text');
      textarea.value = (textarea.value ? textarea.value + ' ' : '') + transcript;
    },
    (err) => {
      statusEl.innerHTML = `<p class="muted" style="color:var(--danger);">${err==='NOT_SUPPORTED' ? t('notSupported') : t('micError')}</p><p class="muted" style="font-family:var(--font-mono);font-size:11px;direction:ltr;">lang=${SPEECH_LANG_MAP[lang]} error=${err}</p>`;
    },
    () => { statusEl.innerHTML = `<p class="muted"><i class="ti ti-microphone" style="color:var(--danger);"></i> ${t('listening')}</p>`; },
    (warning) => { statusEl.innerHTML += `<p class="muted" style="font-family:var(--font-mono);font-size:11px;direction:ltr;color:var(--warning);">audio file: ${warning.replace(/</g,'&lt;')}</p>`; }
  );
}

/* ---------- بدء التشغيل ---------- */
document.documentElement.dir = I18N[lang].dir;
document.documentElement.lang = lang;
document.getElementById('langSwitch').value = lang;

/* استعادة جلسة الدخول تلقائيًا لو المستخدم كان مسجّل دخول سابقًا على هذا الجهاز/المتصفح */
if(FIREBASE_READY){
  fbAuth.onAuthStateChanged(async (user) => {
    if(user){
      try{
        const profileDoc = await fbDb.collection('users').doc(user.uid).get();
        if(profileDoc.exists){
          const profile = profileDoc.data();
          currentUser = { id: user.uid, role: profile.role, name: profile.name || profile.username, username: profile.username };
        }
      }catch(err){ console.warn('session restore failed:', err.message); }
    }
    render();
  });
}
