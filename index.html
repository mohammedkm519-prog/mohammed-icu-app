<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12554F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart ICU">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>نظام مراقبة المرضى الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#0A2E2C; --ink-2:#0E3E3B; --brand:#12554F; --brand-light:#1C7268;
    --danger:#A32D2D; --warning:#8A5A0B;
    --bg:#EEF1F0; --card:#FFFFFF; --border:#D7DCDA; --border-strong:#B7BFBB;
    --text:#151D1C; --text-muted:#5B6664; --text-faint:#8A9391;
    --mon-bg:#071615; --mon-hr:#3ED598; --mon-spo2:#4FC3E8; --mon-bp:#F3716A; --mon-rr:#E8E4D8; --mon-temp:#F0B429;
    --radius:10px; --radius-lg:16px;
    --font-ui:'Inter',-apple-system,'Segoe UI',Tahoma,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font-ui);margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  header{background:linear-gradient(180deg,var(--ink-2),var(--ink));color:#fff;padding:12px 22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);}
  header .brand{display:flex;align-items:center;gap:10px;justify-content:center;grid-column:2;}
  header .brand-icons{display:flex;gap:5px;}
  header .brand-icons i{font-size:17px;}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px;direction:ltr;white-space:nowrap;}
  header .controls{display:flex;gap:10px;align-items:center;grid-column:3;justify-self:end;}
  select, input, textarea, button{font-family:inherit;font-size:16px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);}
  select, input, textarea{background:#fff;color:var(--text);}
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(28,114,104,.14);}
  button{background:var(--brand);color:#fff;border:none;cursor:pointer;font-weight:600;transition:background .15s;}
  button:hover{background:var(--ink-2);}
  button:focus-visible{outline:2px solid var(--mon-spo2);outline-offset:2px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:176px;overflow-y:auto;padding:8px;border:1px solid var(--border);border-radius:10px;background:#fff;}
  button.chip{background:#F1F3F2;color:var(--text);border:1px solid var(--border);padding:6px 11px;border-radius:18px;font-size:13px;font-weight:500;line-height:1.25;}
  button.chip:hover{background:#E4E9E7;}
  button.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .chip-add{display:flex;gap:6px;margin-top:6px;}
  .chip-add input{flex:1;min-width:0;}
  button.secondary{background:transparent;color:var(--text-muted);border:1px solid var(--border-strong);}
  button.secondary:hover{background:#fff;color:var(--text);}
  button.danger{background:var(--danger);}
  header select{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2);}
  header #userBadge{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:20px;font-weight:500;}
  .container{max-width:1100px;margin:24px auto;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(10,46,44,.04);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .stepper-row{display:flex;align-items:stretch;gap:6px;}
  .stepper-row input{flex:1 1 auto;min-width:0;text-align:center;}
  .stepper-row input::-webkit-outer-spin-button, .stepper-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .stepper-row input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  .stepper-btn{flex:0 0 44px;width:44px;padding:0 !important;font-size:20px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;}
  .field label{font-size:12.5px;color:var(--text-muted);font-weight:500;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--border);font-size:14px;}
  th{color:var(--text-muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;}
  .badge{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block;}
  .badge.low{background:#EAF3DE;color:#27500A;}
  .badge.med{background:#FAEEDA;color:#8A5A0B;}
  .badge.high{background:#F5D5C7;color:#7A2E13;}
  .badge.crit{background:#F5C6C4;color:#7A1F1D;}
  .patient-row{cursor:pointer;}
  .patient-row:hover{background:#F4F7F6;}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:11px 16px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;font-size:14px;transition:color .15s;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
  .alert-box{border-inline-start:4px solid var(--danger);background:#FBEDEC;padding:11px 14px;border-radius:8px;margin-bottom:8px;font-size:14px;}
  .alert-box.med{border-inline-start-color:var(--warning);background:#FAEEDA;}
  .login-shell{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;}
  .login-box{max-width:380px;width:100%;text-align:center;}
  .login-box .card{padding:32px 28px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .login-box h2{font-size:18px;margin:0 0 4px;font-weight:600;}
  .login-box .muted{margin-bottom:20px;}
  .role-btn{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:14px 16px;font-size:15px;background:#fff;color:var(--text);border:1px solid var(--border-strong);text-align:start;}
  .role-btn-admin{border:1.5px solid #D4A017;background:linear-gradient(0deg,#FFF9EC,#FFFDF8);}
  .role-btn-admin:hover{background:#D4A017;color:#fff;border-color:#D4A017;}
  .role-btn-admin:hover i{color:#fff !important;}
  .role-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .role-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-light);flex-shrink:0;}
  .muted{color:var(--text-muted);font-size:13px;}
  .warn-banner{background:#FAEEDA;border:1px solid #E8B84B;color:#6B4A08;padding:11px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .link-btn{background:none;color:var(--brand);border:none;text-decoration:none;padding:0;font-weight:600;font-size:14px;margin-bottom:14px;display:inline-block;}
  .link-btn:hover{text-decoration:underline;}

  .monitor-panel{background:var(--mon-bg);border-radius:var(--radius-lg);padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:2px;overflow:hidden;}
  .mon-tile{padding:10px 14px;position:relative;}
  .mon-tile + .mon-tile{border-inline-start:1px solid rgba(255,255,255,.07);}
  .mon-label{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;}
  .mon-value{font-family:var(--font-mono);font-size:30px;font-weight:700;line-height:1;direction:ltr;text-align:start;}
  .mon-unit{font-family:var(--font-mono);font-size:12px;font-weight:500;opacity:.55;margin-inline-start:3px;}
  .mon-hr .mon-value{color:var(--mon-hr);} .mon-spo2 .mon-value{color:var(--mon-spo2);}
  .mon-bp .mon-value{color:var(--mon-bp);} .mon-rr .mon-value{color:var(--mon-rr);} .mon-temp .mon-value{color:var(--mon-temp);}
  .mon-empty{font-family:var(--font-mono);color:rgba(255,255,255,.3);font-size:13px;padding:20px;text-align:center;grid-column:1/-1;}
  .score-tile{background:var(--ink);border-radius:var(--radius-lg);padding:16px 20px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}

  /* ===== الجدول الزمني اليومي (الملخص الذكي) ===== */
  .day-timeline{position:relative;padding-inline-start:34px;}
  .day-timeline::before{content:'';position:absolute;inset-inline-start:13px;top:6px;bottom:6px;width:2px;background:var(--border);}
  .day-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(10,46,44,.04);}
  .day-card.admission-day{border-inline-start:4px solid #D4A017;}
  .day-card:not(.admission-day){border-inline-start:4px solid var(--brand-light);}
  .day-badge{position:absolute;inset-inline-start:-34px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:700;border:3px solid var(--bg);}
  .day-card.admission-day .day-badge{background:#D4A017;}
  .day-card-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .day-card-title{font-weight:700;font-size:15px;}
  .day-narrative{background:#F4F7F6;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;}
  .day-section{margin-top:8px;font-size:13.5px;}
  .day-section-label{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}
  .day-section ul{margin:0;padding-inline-start:18px;}
  .med-chip{display:inline-flex;align-items:center;gap:4px;background:#EAF3DE;color:#27500A;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-inline-end:4px;margin-bottom:4px;}
  @keyframes toastIn{from{transform:translateY(-12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .score-num{font-family:var(--font-mono);font-size:26px;font-weight:700;}
  .score-label{font-size:12px;color:rgba(255,255,255,.55);}

  /* ===== بطاقات المرضى (لوحة شاملة بنظرة واحدة) ===== */
  .patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .patient-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .patient-card:hover{border-color:var(--brand-light);box-shadow:0 4px 14px rgba(10,46,44,.09);}
  .patient-card .pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .patient-card .pc-name{font-weight:600;font-size:15.5px;}
  .patient-card .pc-meta{color:var(--text-muted);font-size:13px;margin-top:2px;}
  .pc-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .pc-vitals{display:flex;gap:14px;padding-top:10px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:13px;color:var(--text-muted);}
  .pc-vitals i{font-size:15px;margin-inline-end:3px;vertical-align:-2px;}
  .pc-add-card{border:1.5px dashed var(--border-strong);background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--brand);min-height:120px;font-weight:600;}
  .pc-add-card i{font-size:26px;}
  .pc-add-card:hover{border-color:var(--brand);background:#F4F7F6;}

  /* ===== لوحة ملف المريض (Sidebar dashboard) ===== */
  .file-shell{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start;}
  @media (max-width:800px){ .file-shell{grid-template-columns:1fr;} }

  #printArea{display:none;}
  @media print{
    body > header, body > #app{display:none !important;}
    body{padding-bottom:0;}
    #printArea{display:block !important;background:#fff;color:#000;padding:0;font-family:var(--font-ui);}
    #printArea h1{font-size:18px;margin-bottom:2px;}
    #printArea h2{font-size:14px;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
    #printArea th, #printArea td{border:1px solid #ccc;padding:4px 6px;text-align:start;}
    #printArea p{font-size:12px;margin:2px 0;}
  }
  .file-side{position:sticky;top:16px;}
  .file-side .pt-summary{text-align:center;padding:22px 16px;}
  .file-side .pt-avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px;}
  .file-side .pt-name{font-weight:600;font-size:16px;}
  .file-side .pt-meta{color:var(--text-muted);font-size:13px;margin-top:3px;}
  .file-side .pt-tags{margin-top:12px;text-align:start;font-size:12.5px;color:var(--text-muted);line-height:1.7;}
  .sidenav{display:flex;flex-direction:column;gap:2px;padding:6px;}
  .sidenav .snitem{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;}
  .sidenav .snitem i{font-size:18px;width:20px;text-align:center;}
  .sidenav .snitem:hover{background:var(--bg);color:var(--text);}
  .sidenav .snitem.active{background:var(--brand);color:#fff;}

  /* ===== تصميم الموبايل/التابلت: شريط تنقل ثابت بالأسفل بدل القائمة الجانبية ===== */
  @media (max-width:800px){
    body{padding-bottom:78px;}
    header{padding:10px 14px;}
    header h1{font-size:15px;}
    .container{padding:0 10px;margin:14px auto;}
    .file-side{position:static;}
    .file-side .pt-summary{padding:14px 12px;}
    .nav-card{
      position:fixed;inset-inline:0;bottom:0;z-index:60;border-radius:0;margin:0;
      box-shadow:0 -4px 16px rgba(10,46,44,.12);border-inline:none;border-bottom:none;
      padding-bottom:calc(6px + env(safe-area-inset-bottom));
    }
    .sidenav{flex-direction:row;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .sidenav::-webkit-scrollbar{display:none;}
    .sidenav .snitem{flex:1 0 auto;flex-direction:column;gap:3px;padding:8px 10px;font-size:10.5px;white-space:nowrap;text-align:center;min-width:64px;}
    .sidenav .snitem i{font-size:20px;}
    /* مساحات لمس أكبر للحقول والأزرار */
    select, input, textarea, button{padding:12px 14px;}
    .field{margin-bottom:14px;}
    .grid{gap:14px;}
    table{font-size:13px;}
    th,td{padding:8px 6px;}
  }
</style>
</head>
<body>

<header>
  <span></span>
  <div class="brand">
    <div class="brand-icons">
      <i class="ti ti-heartbeat" style="color:#3ED598;" aria-hidden="true"></i>
      <i class="ti ti-droplet-half-2" style="color:#4FC3E8;" aria-hidden="true"></i>
      <i class="ti ti-pill" style="color:#F0B429;" aria-hidden="true"></i>
    </div>
    <h1 id="appTitle">M Z Smart ICU</h1>
    <span id="appVer" style="font-size:10px;opacity:.55;align-self:center;direction:ltr;">v37-Oct-bg</span>
  </div>
  <div class="controls">
    <select id="langSwitch" onchange="setLanguage(this.value)">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
      <option value="fa">فارسی</option>
    </select>
    <button id="notifBtn" class="secondary" style="position:relative;" onclick="onNotifBellClick()" title="">
      <i id="notifBellIcon" class="ti ti-bell"></i>
      <span id="notifBadge" style="display:none;position:absolute;top:-4px;inset-inline-end:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;align-items:center;justify-content:center;padding:0 3px;"></span>
    </button>
    <button id="aiSettingsBtn" class="secondary" onclick="toggleAiSettings()"><i class="ti ti-settings"></i></button>
    <span id="userBadge" style="display:none;color:#fff;font-size:13px;"></span>
    <button id="logoutBtn" class="secondary" style="display:none;" onclick="logout()">خروج</button>
  </div>
</header>
<div id="aiSettingsPanel" class="card" style="display:none;position:fixed;top:60px;inset-inline-end:20px;width:320px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.15);"></div>

<div class="container" id="app"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   ملاحظة مهمة: هذا نموذج أولي (Prototype) يعمل بالكامل داخل
   المتصفح ويخزن البيانات محليًا (localStorage) لأغراض التجربة
   والعرض فقط. البيانات هنا لا تُعتبر آمنة للاستخدام الفعلي مع
   مرضى حقيقيين قبل ربطها بخادم حقيقي مشفّر (سنفعل هذا لاحقًا).
   ========================================================= */

/* ---------- الترجمة (i18n) ---------- */
const I18N = {
  ar: { dir:'rtl', appTitle:'M Z Smart ICU', login:'اختر دورك لتسجيل الدخول',
    admin:'مدير', doctor:'طبيب', nurse:'ممرض', logout:'خروج',
    patients:'المرضى', addPatient:'إضافة مريض جديد', name:'الاسم', age:'العمر', gender:'الجنس',
    male:'ذكر', female:'أنثى', weight:'الوزن (kg)', height:'الطول (cm)', chronic:'الأمراض المزمنة',
    allergies:'الحساسية للأدوية', pastHx:'الأمراض السابقة / التاريخ المرضي', homeMeds:'الأدوية التي يستخدمها (في المنزل)', plannedMeds:'الأدوية المطلوب إعطاؤها', addOther:'أضف خيارًا آخر...', addBtn:'إضافة', pickHint:'اضغط على الخيارات المناسبة، أو أضف خيارًا غير موجود', vmStop:'إيقاف وتحليل', vmFilled:'تم التعرّف على', vmFill:'تعبئة', vmTypePh:'أو اكتب/أملِ: ضغط 120 على 80 نبض 90 حرارة 37.5 أكسجين 96 تنفس 18', vmNone:'لم أتعرّف على أي قيمة. تحدّث ببطء مع ذكر اسم كل علامة (ضغط، نبض، حرارة، أكسجين، تنفس) أو اكتبها في الحقل أدناه.', vmNetwork:'خدمة التعرف الصوتي تحتاج إنترنت (خوادم Google) وقد تكون محجوبة في شبكتك. جرّب VPN، أو استخدم الإملاء من لوحة مفاتيح الهاتف في الحقل أدناه.', save:'حفظ', cancel:'إلغاء', search:'بحث عن مريض...',
    tabOverview:'نظرة عامة', tabVitals:'العلامات الحيوية', tabLabs:'التحاليل المخبرية', tabABG:'غازات الدم ABG/VBG',
    tabOrders:'الأوامر الطبية', tabNotes:'الملاحظات', tabScores:'مؤشرات الخطورة',

  document.documentElement.lang = l;

   مفتاح الـ API بيُخزّن محليًا بمتصفحك فقط ويُستخدم للاتصال المباشر بمزوّد
   الخدمة (OpenAI أو Google). هذا مقبول لمرحلة التجربة، لكن بالنسخة الإنتاجية
   النهائية يُفضّل تمرير الطلب عبر خادم خلفي حتى لا يظهر المفتاح داخل كود
   المتصفح لأي شخص يفتح "أدوات المطوّر". ========================================= */
let aiConfigCache = { provider:'openai', apiKey:'' };
let aiConfigUnsubscribe = null;
function getAiConfig(){ return aiConfigCache; }
async function migrateAiConfigIfNeeded(){
  try{
    const oldRaw = localStorage.getItem('ai_config');
    if(!oldRaw) return;
    const doc = await fbDb.collection('settings').doc('aiConfig').get();
    if(!doc.exists){
      const old = JSON.parse(oldRaw);
      if(old.apiKey) await fbDb.collection('settings').doc('aiConfig').set(old);
    }
    localStorage.removeItem('ai_config');
  }catch(err){ console.warn('ai config migration skipped:', err.message); }
}
function subscribeAiConfig(){
  if(aiConfigUnsubscribe) return;
  migrateAiConfigIfNeeded();
  aiConfigUnsubscribe = fbDb.collection('settings').doc('aiConfig').onSnapshot(doc => {
    if(doc.exists) aiConfigCache = doc.data();
  }, err => console.warn('ai config sync error:', err.message));
}
function toggleAiSettings(){
  const panel = document.getElementById('aiSettingsPanel');
  if(panel.style.display === 'block'){ panel.style.display = 'none'; return; }
  const cfg = getAiConfig();
  panel.innerHTML = `
    <div class="flex-between" style="margin-bottom:10px;">
      <h3 style="margin:0;font-size:15px;">${t('aiSettings')}</h3>
      <button class="secondary" style="padding:4px 8px;" onclick="toggleAiSettings()"><i class="ti ti-x"></i></button>
    </div>
    <div class="field"><label>${t('aiProvider')}</label>
      <select id="ai_provider">
        <option value="auto" ${(!cfg.provider||cfg.provider==='auto')?'selected':''}>Auto (fallback chain)</option>
        <option value="gemini" ${cfg.provider==='gemini'?'selected':''}>Google Gemini first</option>
        <option value="groq" ${cfg.provider==='groq'?'selected':''}>Groq first</option>
        <option value="openrouter" ${cfg.provider==='openrouter'?'selected':''}>OpenRouter first</option>
        <option value="openai" ${cfg.provider==='openai'?'selected':''}>OpenAI first</option>
      </select>
    </div>
    ${AI_PROVIDERS.map(p => `<div class="field"><label>${p.label} — ${t('apiKey')} <span class="muted" dir="ltr">${p.hint}</span></label><input id="ai_key_${p.id}" type="password" dir="ltr" value="${String(aiKeysOf(cfg)[p.id]||'').replace(/"/g,'')}" placeholder="${p.label} key (optional)"></div>`).join('')}
    <div class="field"><label>OpenRouter model (optional)</label><input id="ai_model" type="text" dir="ltr" value="${(cfg.model||'').replace(/"/g,'')}" placeholder="google/gemini-2.5-flash"></div>
    <div class="field"><label>Groq model (optional)</label><input id="ai_model_groq" type="text" dir="ltr" value="${((cfg.models||{}).groq||'').replace(/"/g,'')}" placeholder="llama-3.3-70b-versatile"></div>
    <p class="muted">${t('apiKeyHint')}</p>
    <button onclick="saveAiConfig()" style="width:100%;">${t('save')}</button>
  `;
  panel.style.display = 'block';
}
async function saveAiConfig(){
  const keys = {}; AI_PROVIDERS.forEach(p => { const v = (document.getElementById('ai_key_'+p.id)||{value:''}).value.trim(); if(v) keys[p.id] = v; });
  const prov = document.getElementById('ai_provider').value;
  const firstId = (prov !== 'auto' && keys[prov]) ? prov : (AI_PROVIDERS.map(p=>p.id).find(id => keys[id]) || '');
  const cfg = { provider: prov, apiKey: keys[firstId] || '', keys, model: (document.getElementById('ai_model')||{value:''}).value.trim(), models: { groq: (document.getElementById('ai_model_groq')||{value:''}).value.trim() } };
  try{
    await fbDb.collection('settings').doc('aiConfig').set(cfg);
    toggleAiSettings();
  }catch(err){
    const panel = document.getElementById('aiSettingsPanel');
    panel.innerHTML += `<div class="alert-box" style="margin-top:8px;font-family:var(--font-mono);font-size:12px;direction:ltr;word-break:break-all;">${(err.message||'').replace(/</g,'&lt;')}</div>`;
  }
}

/* aiFetch: يحاول الاتصال المباشر بخادم الذكاء الاصطناعي، وإن حجبته الشبكة (Failed to fetch)
   يعيد المحاولة عبر وسيط Netlify Function على نفس موقعك (خوادم Netlify غير محجوبة عادةً). */
async function aiFetchOnce(url, init){
  try{
    return await fetch(url, init);
  }catch(directErr){
    if(!/^https?:/.test(location.protocol)) throw directErr;
    let r;
    try{
      r = await fetch('/.netlify/functions/ai-proxy', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ url, headers: init.headers || {}, body: init.body || '' })
      });
    }catch(e2){ throw directErr; }
    if(r.status === 404 || r.status === 405) throw directErr;   // الوسيط غير منشور على الموقع
    const text = await r.text();
    return new Response(text, { status: r.status, headers:{ 'Content-Type':'application/json' } });
  }
}

/* Gemini: نجرّب اسم النموذج الحالي ثم البدائل إذا أعاد الخادم 404 (النموذج لم يعد متاحًا). */
const GEMINI_MODELS = ['gemini-flash-latest', 'gemini-3.8-flash', 'gemini-2.5-flash'];
let geminiIdx = 0;
async function aiFetch(url, init){
  if(url.indexOf('generativelanguage.googleapis.com') < 0) return aiFetchOnce(url, init);
  let last;
  for(let i = geminiIdx; i < GEMINI_MODELS.length; i++){
    const u = url.replace(/models\/[^:]+:/, 'models/' + GEMINI_MODELS[i] + ':');
    last = await aiFetchOnce(u, init);
    if(last.status === 404 && i < GEMINI_MODELS.length - 1) continue;
    geminiIdx = i; return last;
  }
  return last;
}
const OR_URL = 'https://openrouter.ai/api/v1/chat/completions';
function orModel(cfg){ return (cfg.model && cfg.model.trim()) || 'google/gemini-2.5-flash'; }
function orHeaders(cfg){ return { 'Content-Type':'application/json', 'Authorization':'Bearer ' + String(cfg.apiKey||'').trim(), 'HTTP-Referer': location.origin || 'https://github.io', 'X-Title':'M Z Smart ICU' }; }

  { const k = aiKeysOf(cfg); const vis = ['gemini','openrouter','openai'];

  const prompt = customPrompt || 'You are reading a medical lab report image. Extract every test name and its value. Respond with ONLY a raw JSON array, no markdown, no explanation, in this exact shape: [{"test":"CBC - WBC","value":"18.2 x10^9/L"}]. If unreadable, return [].';

  if(cfg.provider === 'openai'){
    let res;
    try{

    }

    if(!text) throw new Error('EMPTY_RESPONSE: ' + JSON.stringify(data).slice(0,200));
    return asObject ? parseJsonObjectSafe(text) : parseJsonArraySafe(text);
  }

  if(cfg.provider === 'openrouter'){
    let res;
    try{
      res = await aiFetch(OR_URL, { method:'POST', headers: orHeaders(cfg), body: JSON.stringify({
        model: orModel(cfg),
        messages: [{ role:'user', content:[ { type:'text', text: prompt }, { type:'image_url', image_url:{ url: base64DataUrl } } ]}],
        max_tokens: 800 }) });
    }catch(networkErr){ throw new Error('NETWORK: ' + networkErr.message); }
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.error) throw new Error('HTTP ' + res.status + ': ' + (data.error?.message || res.statusText || 'unknown'));
    const text = data.choices?.[0]?.message?.content;
    if(!text) throw new Error('EMPTY_RESPONSE: ' + JSON.stringify(data).slice(0,200));
    return asObject ? parseJsonObjectSafe(text) : parseJsonArraySafe(text);
  }

  if(cfg.provider === 'gemini'){
    const base64 = base64DataUrl.split(',')[1];
    const mime = base64DataUrl.substring(5, base64DataUrl.indexOf(';'));
    let res;
    try{
      res = await aiFetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key': String(cfg.apiKey||'').trim() },
        body: JSON.stringify({
          contents: [{ parts:[
            { text: prompt },

          ]}]
        })
      });
    }catch(networkErr){
      throw new Error('NETWORK: ' + networkErr.message);
    }
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.error){
      throw new Error('HTTP ' + res.status + ': ' + (data.error?.message || res.statusText || 'unknown'));
    }
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('EMPTY_RESPONSE: ' + JSON.stringify(data).slice(0,200));
    return asObject ? parseJsonObjectSafe(text) : parseJsonArraySafe(text);
  }
  throw new Error('UNKNOWN_PROVIDER');
}
function parseJsonArraySafe(text){
  const match = text.match(/\[[\s\S]*\]/);
  if(!match) throw new Error('RAW_RESPONSE: ' + text.slice(0, 300));
  try { return JSON.parse(match[0]); } catch(e){ throw new Error('RAW_RESPONSE: ' + text.slice(0, 300)); }
}
function jsonRepair(str){
  // يصلح JSON مقطوعاً أو به فواصل زائدة: يغلق النصوص والأقواس المفتوحة
  let out = '', stack = [], inStr = false, esc = false;
  for(const ch of str){
    out += ch;
    if(inStr){ if(esc) esc = false; else if(ch === '\\') esc = true; else if(ch === '"') inStr = false; continue; }
    if(ch === '"') inStr = true;
    else if(ch === '{' || ch === '[') stack.push(ch);
    else if(ch === '}' || ch === ']') stack.pop();
  }
  if(inStr) out += '"';
  out = out.replace(/,\s*$/, '').replace(/:\s*$/, ':null');
  while(stack.length){ out = out.replace(/,\s*$/, ''); out += stack.pop() === '{' ? '}' : ']'; }
  return out.replace(/,\s*([}\]])/g, '$1');
}
function parseJsonObjectSafe(text){
  let t0 = String(text || '').replace(/```(?:json)?/gi, '').replace(/<think>[\s\S]*?<\/think>/gi, '');
  const i = t0.indexOf('{');
  if(i < 0) throw new Error('RAW_RESPONSE: ' + t0.slice(0, 300));
  const body = t0.slice(i);
  const last = body.lastIndexOf('}');
  const tries = [ last >= 0 ? body.slice(0, last + 1) : '', body ];
  for(const c of tries){ if(!c) continue; try{ return JSON.parse(c); }catch(e){} try{ return JSON.parse(jsonRepair(c)); }catch(e){} }
  // آخر محاولة: اقطع عند آخر عنصر كامل ثم أصلح
  for(let k = body.length - 1; k > 0; k--){ if(body[k] === '}' || body[k] === ']'){ try{ return JSON.parse(jsonRepair(body.slice(0, k + 1))); }catch(e){} } }
  throw new Error('RAW_RESPONSE: ' + t0.slice(0, 300));
}

/* استدعاء نصي بسيط للذكاء الاصطناعي (بدون صورة) - يُستخدم لتحويل جملة منطوقة
   إلى قيم علامات حيوية منظّمة. لا يُستخدم لأي تشخيص أو قرار علاجي. */
const AI_PROVIDERS = [
  { id:'gemini',     label:'Google Gemini',  hint:'aistudio.google.com/apikey' },
  { id:'groq',       label:'Groq',           hint:'console.groq.com/keys', url:'https://api.groq.com/openai/v1/chat/completions', model:'llama-3.3-70b-versatile' },
  { id:'openrouter', label:'OpenRouter',     hint:'openrouter.ai/keys' },
  { id:'openai',     label:'OpenAI',         hint:'platform.openai.com/api-keys' }
];
function aiKeysOf(cfg){
  const k = Object.assign({}, cfg.keys || {});
  if(cfg.apiKey && cfg.provider && cfg.provider !== 'auto' && !k[cfg.provider]) k[cfg.provider] = cfg.apiKey;
  return k;
}
async function callAiTextSingle(cfg, prompt, maxTokens){
  if(!cfg.apiKey) throw new Error('NO_KEY');
  if(cfg.provider === 'groq'){
    const gkey = String(cfg.apiKey).trim();
    const call = async (model) => {
      const res = await aiFetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + gkey },
        body: JSON.stringify({ model, messages:[{ role:'user', content: prompt }], max_tokens: maxTokens || 1500 })
      });
      const data = await res.json().catch(()=>({}));
      return { res, data };
    };
    let cached = ''; try{ cached = localStorage.getItem('mz_groq_model') || ''; }catch(e){}
    let model = (cfg.model && cfg.model.trim()) || cached || 'llama-3.3-70b-versatile';
    let { res, data } = await call(model);
    const modelErr = (!res.ok) && /model|decommission|does not exist|no access/i.test((data.error && data.error.message) || '');
    if(modelErr){
      const lr = await aiFetch('https://api.groq.com/openai/v1/models', { headers:{ 'Authorization':'Bearer ' + gkey } });
      const ld = await lr.json().catch(()=>({}));
      const ids = ((ld.data) || []).map(m => m.id).filter(id => !/whisper|tts|guard|orpheus|embed|playai|distil/i.test(id));
      const pref = [/llama-3\.3-70b/, /gpt-oss-120b/, /llama-4/, /qwen/, /gpt-oss-20b/, /llama-3\.1-8b/, /llama/];
      let pick = ''; for(const rx of pref){ pick = ids.find(id => rx.test(id)) || ''; if(pick) break; }
      if(!pick) pick = ids[0] || '';
      if(pick && pick !== model){
        ({ res, data } = await call(pick));
        if(res.ok){ try{ localStorage.setItem('mz_groq_model', pick); }catch(e){} }
      }
    }
    if(!res.ok || data.error) throw new Error('HTTP ' + res.status + ': ' + (data.error?.message || res.statusText || 'unknown'));
    const text = data.choices?.[0]?.message?.content;
    if(!text) throw new Error('EMPTY_RESPONSE: ' + JSON.stringify(data).slice(0,200));
    return text;
  }
  if(cfg.provider === 'openai'){
    const res = await aiFetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model:'gpt-4o-mini', messages:[{ role:'user', content: prompt }], max_tokens: maxTokens || 300 })
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error('HTTP ' + res.status + ': ' + (data.error?.message || res.statusText || 'unknown'));
    return data.choices[0].message.content;
  }
  if(cfg.provider === 'openrouter'){
    const res = await aiFetch(OR_URL, { method:'POST', headers: orHeaders(cfg),
      body: JSON.stringify({ model: orModel(cfg), messages:[{ role:'user', content: prompt }], max_tokens: maxTokens || 300 }) });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.error) throw new Error('HTTP ' + res.status + ': ' + (data.error?.message || res.statusText || 'unknown'));
    const text = data.choices?.[0]?.message?.content;
    if(!text) throw new Error('EMPTY_RESPONSE: ' + JSON.stringify(data).slice(0,200));
    return text;
  }
  if(cfg.provider === 'gemini'){
    const res = await aiFetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': String(cfg.apiKey||'').trim() },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error('HTTP ' + res.status + ': ' + (data.error?.message || res.statusText || 'unknown'));
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('EMPTY_RESPONSE: ' + JSON.stringify(data).slice(0,200));
    return text;
  }
  throw new Error('UNKNOWN_PROVIDER');
}
/* سلسلة المزوّدين: يجرّب كل مزوّد له مفتاح بالترتيب، وينتقل للتالي عند الحد اليومي (429)
   أو الضغط (503) أو انقطاع الشبكة أو انتهاء صلاحية النموذج. */
async function callAiTextOnly(prompt, maxTokens){
  const cfg = getAiConfig();
  const keys = aiKeysOf(cfg);
  const models = cfg.models || {};
  let order = AI_PROVIDERS.map(p => p.id).filter(id => keys[id]);
  if(cfg.provider && cfg.provider !== 'auto' && keys[cfg.provider]) order = [cfg.provider].concat(order.filter(x => x !== cfg.provider));
  if(!order.length) throw new Error('NO_KEY');
  let lastErr = null; const tried = [];
  for(const id of order){
    try{
      const one = { provider:id, apiKey:keys[id], model: models[id] || (id === 'openrouter' ? cfg.model : '') || '' };
      const out = await callAiTextSingle(one, prompt, maxTokens);
      aiLastUsed = id;
      return out;
    }catch(err){
      lastErr = err; tried.push(id + ': ' + String(err.message||err).slice(0,120));
    }
  }
  throw new Error(tried.join(' | '));
}
let aiLastUsed = '';
async function extractVitalsFromSpeech(transcript){
  const prompt = `Extract vital signs mentioned in this spoken clinical note (any language). If blood pressure is given as "120/80" or "120 على 80" or similar, split it into systolic and diastolic separately. Respond with ONLY a raw JSON object, no markdown, using these exact keys (use null for anything not mentioned): {"bp_sys":number|null,"bp_dia":number|null,"pulse":number|null,"temp":number|null,"spo2":number|null,"rr":number|null}. Spoken text: "${transcript}"`;
  const text = await callAiTextOnly(prompt);
  return parseJsonObjectSafe(text);
}

/* ---------- تسجيل الصوت الفعلي (ملف صوتي) - يُحفظ بشكل خاص، يظهر للمدير فقط ----------
   يعمل بالتوازي مع التعرف الصوتي: نفس الضغطة على الميكروفون تسجّل الصوت الخام
   وتحوّله لنص بنفس الوقت. لو تعذّر الوصول للميكروفون لتسجيل الملف (صلاحية
   مرفوضة مثلًا)، يكمل التعرف الصوتي للنص لوحده بدون ما يفشل كل شي. */
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

let cloudSttSession = null;
async function cloudSttStart(){
  const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
  const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  rec.start();
  return {
    stop: () => new Promise(resolve => {
      rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); resolve(new Blob(chunks, { type: rec.mimeType || mime || 'audio/mp4' })); };
      try{ rec.stop(); }catch(e){ stream.getTracks().forEach(t => t.stop()); resolve(new Blob(chunks)); }
    })
  };
}
function sttExt(mime){ return /mp4|aac|m4a/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm'; }
async function cloudTranscribe(blob){
  const cfg = getAiConfig(); const keys = aiKeysOf(cfg);
  if(!keys.groq && !keys.openai && !keys.gemini) throw new Error('NO_STT_KEY');
  if(blob.size < 1500) throw new Error('EMPTY_AUDIO');
  const code = { ar:'ar', en:'en', tr:'tr', fa:'fa' }[lang] || 'ar';
  const errs = [];
  const form = (model) => { const f = new FormData(); f.append('file', blob, 'audio.' + sttExt(blob.type)); f.append('model', model); f.append('language', code); f.append('response_format', 'json'); f.append('temperature', '0'); return f; };
  if(keys.groq){
    try{
      const r = await aiFetch('https://api.groq.com/openai/v1/audio/transcriptions', { method:'POST', headers:{ 'Authorization':'Bearer ' + keys.groq.trim() }, body: form('whisper-large-v3-turbo') });
      const d = await r.json().catch(()=>({}));
      if(r.ok && typeof d.text === 'string') return d.text.trim();
      errs.push('groq ' + r.status + ': ' + (d.error?.message || ''));
    }catch(e){ errs.push('groq: ' + e.message); }
  }
  if(keys.openai){
    try{
      const r = await aiFetch('https://api.openai.com/v1/audio/transcriptions', { method:'POST', headers:{ 'Authorization':'Bearer ' + keys.openai.trim() }, body: form('whisper-1') });
      const d = await r.json().catch(()=>({}));
      if(r.ok && typeof d.text === 'string') return d.text.trim();
      errs.push('openai ' + r.status + ': ' + (d.error?.message || ''));
    }catch(e){ errs.push('openai: ' + e.message); }
  }
  if(keys.gemini){
    try{
      const b64 = (await blobToBase64(blob)).split(',')[1];
      const langName = { ar:'Arabic', en:'English', tr:'Turkish', fa:'Persian' }[lang] || 'Arabic';
      const baseMime = (blob.type || 'audio/mp4').split(';')[0];
      for(const mt of (baseMime === 'audio/mp4' ? ['audio/mp4','audio/aac'] : [baseMime])){
        const r = await aiFetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
          method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key': keys.gemini.trim() },
          body: JSON.stringify({ contents:[{ parts:[ { text:'Transcribe this audio exactly as spoken in ' + langName + '. Output only the transcript text, nothing else.' }, { inline_data:{ mime_type: mt, data: b64 } } ] }] })
        });
        const d = await r.json().catch(()=>({}));
        const txt = d.candidates?.[0]?.content?.parts?.[0]?.text;
        if(r.ok && txt) return txt.trim();
        errs.push('gemini ' + r.status + ': ' + (d.error?.message || ''));
        if(r.status !== 400) break;
      }
    }catch(e){ errs.push('gemini: ' + e.message); }
  }
  throw new Error(errs.join(' | ').slice(0, 300) || 'STT_FAILED');
}
async function startVoiceCapture(patientId, context, onTranscript, onError, onStart, onAudioWarning){
  let mediaRecorder = null, audioChunks = [], stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size) audioChunks.push(e.data); };
    mediaRecorder.start();
  }catch(err){
    console.warn('audio file capture unavailable:', err.message);
    if(onAudioWarning) onAudioWarning((err.name||'') + ': ' + err.message);
  }

  startSpeechRecognition(
    async (transcript) => {
      if(mediaRecorder && mediaRecorder.state !== 'inactive'){
        await new Promise(resolve => { mediaRecorder.onstop = resolve; mediaRecorder.stop(); });
        stream.getTracks().forEach(t => t.stop());
        try{
          if(audioChunks.length === 0) throw new Error('EMPTY_AUDIO: no audio data captured');
          const audioBase64 = await blobToBase64(new Blob(audioChunks, { type:'audio/webm' }));
          if(audioBase64.length >= 900000) throw new Error('TOO_LARGE: recording exceeds size limit, not saved');
          await fbDb.collection('voiceRecordings').add({
            patientId: patientId || null, context, transcript, audioData: audioBase64, mimeType:'audio/webm',
            time: Date.now(), createdBy: currentActor()
          });
        }catch(err){
          console.warn('voice recording save failed:', err.message);
          if(onAudioWarning) onAudioWarning(err.message);
        }
      }
      onTranscript(transcript);
    },
    (err) => {
      if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if(stream) stream.getTracks().forEach(t => t.stop());
      onError(err);
    },
    onStart
  );
}

/* ---------- التعرف على الكلام (Web Speech API - مدعوم بمتصفح Chrome/Edge) ---------- */
const SPEECH_LANG_MAP = { ar:'ar-IQ', en:'en-US', tr:'tr-TR', fa:'fa-IR' };
function startSpeechRecognition(onResult, onError, onStart){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ onError('NOT_SUPPORTED'); return null; }
  const rec = new SR();
  rec.lang = SPEECH_LANG_MAP[lang] || 'ar-IQ';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => onStart && onStart();
  rec.onresult = (e) => onResult(e.results[0][0].transcript);
  rec.onerror = (e) => onError(e.error || 'ERROR');
  rec.onend = () => {};
  rec.start();
  return rec;
}

/* ---------- قاعدة البيانات المحلية (Demo Storage) ---------- */
const DB_VERSION = 'v7-summary-days';
function loadDB(){
  const raw = localStorage.getItem('clinic_db');
  const storedVersion = localStorage.getItem('clinic_db_version');
  if(!raw){
    // أول تشغيل تمامًا على هذا الجهاز: نزرع بيانات تجريبية للتوضيح فقط
    const initial = seedDemoData();
    localStorage.setItem('clinic_db', JSON.stringify(initial));
    localStorage.setItem('clinic_db_version', DB_VERSION);
    return initial;
  }
  let data = JSON.parse(raw);
  if(storedVersion !== DB_VERSION){
    // ترحيل آمن: تحديث شكل البيانات القديمة بدون حذف أي مريض أو سجل حقيقي أضافه المستخدم
    data = migrateDB(data);
    localStorage.setItem('clinic_db', JSON.stringify(data));
    localStorage.setItem('clinic_db_version', DB_VERSION);
  }
  return data;
}
function migrateDB(data){
  if(Array.isArray(data.vitals)){
    data.vitals = data.vitals.map(v => {
      if(v.bp_sys === undefined && v.bp !== undefined){
        return { ...v, bp_sys: v.bp, bp_dia: (v.bp_dia !== undefined ? v.bp_dia : null) };
      }
      return v;
    });
  }
  if(!Array.isArray(data.io)) data.io = [];
  if(!Array.isArray(data.cardiacFiles)) data.cardiacFiles = [];
  if(!Array.isArray(data.radiologyFiles)) data.radiologyFiles = [];
  if(!Array.isArray(data.summaries)) data.summaries = [];
  // إزالة ملخصات محفوظة بالشكل النصي القديم (قبل الجدول الزمني اليومي) لأنها غير متوافقة مع العرض الجديد
  data.summaries = data.summaries.filter(s => Array.isArray(s.days));
  return data;
}
function seedDemoData(){
  return { vitals: [], labs: [], orders: [], notes: [], io: [], cardiacFiles: [], radiologyFiles: [], summaries: [] };

function loginIndexKeys(u){
  const k = [];
  if(u.username) k.push('u_' + String(u.username).trim().toLowerCase());
  if(u.email) k.push('e_' + String(u.email).trim().toLowerCase());

async function resolveLoginEmail(input){
  const raw = String(input || '').trim();
  const isMail = raw.indexOf('@') > 0;
  const pk = (!isMail && /^[\d+\s()-]{7,}$/.test(raw)) ? phoneKey(raw) : '';
  const key = isMail ? 'e_' + raw.toLowerCase() : pk ? 'p_' + pk : 'u_' + raw.toLowerCase();
  try{
    const d = await fbDb.collection('loginIndex').doc(key).get();
    if(d.exists && d.data().authEmail) return d.data().authEmail;
  }catch(e){ /* القواعد لم تُنشر بعد: نكمل بالطريقة القديمة */ }
  return isMail ? raw.toLowerCase() : usernameToEmail(raw);
}

async function loginWithPassword(username, password, expectedRole){
  const errEl = document.getElementById('loginError');
  try{
    const authEmail = await resolveLoginEmail(username);
    const cred = await fbAuth.signInWithEmailAndPassword(authEmail, password);
    const profileDoc = await fbDb.collection('users').doc(cred.user.uid).get();
    if(!profileDoc.exists){ if(errEl) errEl.textContent = t('wrongCredentials'); await fbAuth.signOut(); return; }
    const profile = profileDoc.data();
    if(expectedRole && profile.role !== expectedRole){ if(errEl) errEl.textContent = t('wrongCredentials'); await fbAuth.signOut(); return; }
    currentUser = { id: cred.user.uid, role: profile.role, name: profile.name || profile.username, username: profile.username, phone: profile.phone || '' };
    selectedLoginRole = null;
    render();
  }catch(err){
    const code=(err&&err.code)||'';
    if(code==='auth/network-request-failed'||code==='unavailable'){

/* حساب درجة SUS (0-100) حسب الصيغة القياسية الرسمية، والتقييم حسب Bangor et al. (2009) */
function calcSUS(answers){
  let total = 0;
  answers.forEach((val, i) => {
    const isOdd = (i % 2 === 0); // فهرسة تبدأ من صفر: العناصر 1،3،5... هي isOdd=true
    total += isOdd ? (val - 1) : (5 - val);
  });
  return Math.round(total * 2.5 * 10) / 10;
}
function susGradeKey(score){
  if(score >= 80.3) return 'gradeExcellent';
  if(score >= 68) return 'gradeGood';
  if(score >= 51) return 'gradeOk';
  return 'gradePoor';
}

function findLabReference(testType){
  if(!testType) return null;
  const q = testType.toLowerCase();
  return LAB_REFERENCE.find(r => r.keys.some(k => q.includes(k))) || null;
}
/* استخراج أول رقم من نص القيمة (مثل "18.2 x10^9/L" -> 18.2) للمقارنة بالنطاق */
function extractLabNumber(value){
  const m = String(value).match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

/* ضغط الصورة تلقائيًا قبل التخزين (تحويل لـ JPEG بعرض أقصى محدد) لتفادي امتلاء ذاكرة المتصفح */
function compressImageToDataURL(file, maxWidth){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.8), wasCompressed: scale < 1 || file.size > 500000 });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

   لا تُترجم لأنها مصطلحات سريرية موحّدة بكل اللغات، متل GCS. */

function getVentStatus(entries){
  const sorted = (entries||[]).slice().sort((a,b)=>b.time-a.time);
  if(!sorted.length || sorted[0].event === 'disconnect') return { connected:false, entries: sorted };
  const lastConnect = sorted.find(e => e.event === 'connect');
  return { connected:true, since: lastConnect ? lastConnect.time : sorted[sorted.length-1].time, latest: sorted[0], entries: sorted };
}

function calcMAP(sys, dia){
  if(sys==null || dia==null) return null;
  return Math.round(dia + (sys - dia) / 3);
}
function calcQSOFA(v){
  let score = 0;
  if(v.rr && v.rr >= 22) score++;
  if(v.bp_sys && v.bp_sys <= 100) score++;
  if(v.gcs_total!=null && v.gcs_total < 15) score++;
  return score; // 0-3, >=2 = high risk of poor outcome
}
function calcNEWS2(v){
  let score = 0;
  if(v.rr <= 8 || v.rr >= 25) score += 3;
  else if(v.rr >= 21) score += 2;
  else if(v.rr <= 11) score += 1;
  if(v.spo2 <= 91) score += 3;
  else if(v.spo2 <= 93) score += 2;
  else if(v.spo2 <= 95) score += 1;
  if(v.bp_sys <= 90 || v.bp_sys >= 220) score += 3;
  else if(v.bp_sys <= 100) score += 2;
  else if(v.bp_sys <= 110) score += 1;
  if(v.pulse <= 40 || v.pulse >= 131) score += 3;
  else if(v.pulse >= 111) score += 2;
  else if(v.pulse <= 50 || v.pulse >= 91) score += 1;
  if(v.temp <= 35) score += 3;
  else if(v.temp >= 39.1) score += 2;
  else if(v.temp <= 36 || v.temp >= 38.1) score += 1;
  return score; // 0-20
}
function riskLevelFromNEWS2(score){
  if(score >= 7) return 'crit';
  if(score >= 5) return 'high';
  if(score >= 1) return 'med';
  return 'low';
}

/* ---------- تنبيهات مبنية على قواعد (Rule-based, ليست تشخيص AI) ---------- */
function checkAlerts(v){
  const alerts = [];
  if(v.bp_sys && v.bp_sys < 90) alerts.push({type:'bp_low', level:'crit'});
  const map = calcMAP(v.bp_sys, v.bp_dia);
  if(map!=null && map < 65) alerts.push({type:'map_low', level:'crit'});
  if(v.spo2 && v.spo2 < 92) alerts.push({type:'spo2_low', level:'high'});
  if(v.temp && v.temp >= 39) alerts.push({type:'temp_high', level:'med'});
  if(v.pulse && (v.pulse > 130 || v.pulse < 40)) alerts.push({type:'pulse_abn', level:'high'});
  return alerts;
}

/* ---------- حساب جدول إعطاء الدواء من الجرعة الكلية وعدد المرات ---------- */
function buildSchedule(freqPerDay){
  const startHour = 8; // تبدأ الجرعات من الساعة 8 صباحًا
  const interval = 24 / freqPerDay;
  const times = [];
  for(let i=0;i<freqPerDay;i++){
    let h = Math.round((startHour + i*interval) % 24);
    times.push(String(h).padStart(2,'0') + ':00');
  }
  return times;
}

/* أقرب موعد جرعة لأمر طبي معلّق - يرجع الفرق بالدقائق (سالب = متأخرة، موجب = قادمة) */
function getNextDoseInfo(order){
  if(!order.schedule || !order.schedule.length || order.status === 'done') return null;
  const now = new Date();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  let closest = null, minDiff = Infinity;
  order.schedule.forEach(timeStr => {
    const [h,m] = timeStr.split(':').map(Number);
    const diff = (h*60+m) - nowMinutes;
    if(Math.abs(diff) < Math.abs(minDiff)){ minDiff = diff; closest = timeStr; }
  });
  return { time: closest, diffMinutes: minDiff };
}
function doseStatusBadge(order){
  const info = getNextDoseInfo(order);
  if(!info) return '';
  if(info.diffMinutes <= 0 && info.diffMinutes > -180){
    return `<span class="badge crit">${t('doseOverdue')} ${Math.abs(info.diffMinutes)}${t('minutesShort')}</span>`;
  }
  if(info.diffMinutes > 0 && info.diffMinutes <= 30){
    return `<span class="badge med">${t('doseDue')} ${info.diffMinutes}${t('minutesShort')}</span>`;
  }
  return '';
}

/* ---------- المرضى: مصدرهم الحقيقي هلق Firestore (مشترك بين كل الأجهزة) ----------
   باقي البيانات (العلامات الحيوية، التحاليل...) لسا محلية مؤقتًا - نقلها
   هو المرحلة الجاية بعد التأكد من نجاح هالمرحلة. */
let patientsCache = [];
let allVitalsCache = [];
let allVitalsUnsubscribe = null;
function subscribeAllVitals(){
  if(allVitalsUnsubscribe) return;
  allVitalsUnsubscribe = fbDb.collection('vitals').onSnapshot(snap => {
    allVitalsCache = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => console.warn('vitals list sync error:', err.message));
}
let allOrdersCache = [];

  if(allOrdersUnsubscribe) return;
  allOrdersUnsubscribe = fbDb.collection('orders').onSnapshot(snap => {
    allOrdersCache = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => console.warn('orders list sync error:', err.message));
}

/* ---------- إشعارات المتصفح الفورية (تعمل ما دام التطبيق مفتوح كتبويب/شاشة رئيسية) ----------
   اشتراك عام (مو مقيّد بمريض واحد) على الأوامر والملاحظات، مع تمييز الإضافات
   الجديدة فعليًا (docChanges) عن التحميل الأولي، حتى ما نرسل إشعارات وهمية
   لبيانات موجودة أصلًا لحظة فتح التطبيق. */
let notifOrdersUnsub = null, notifNotesUnsub = null;
let notifOrdersFirstLoad = true, notifNotesFirstLoad = true;
/* تنبيه صوتي بسيط (نغمة قصيرة مولّدة برمجيًا - ما يحتاج ملف صوت خارجي) */
function playAlertTone(urgent){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beeps = urgent ? [880, 660, 880] : [880];
    beeps.forEach((freq, i) => {
      const start = ctx.currentTime + i * 0.22;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
      osc.start(start); osc.stop(start + 0.18);
    });
  }catch(err){ console.warn('alert tone failed:', err.message); }
  if(urgent && navigator.vibrate){ try{ navigator.vibrate([200,100,200,100,200]); }catch(e){} }
}
let unreadNotifCount = 0;
let notificationHistory = []; // {id, kind, urgent, patientId, patientName, title, body, tab, time}
function bumpNotifBadge(){
  unreadNotifCount++;
  const badge = document.getElementById('notifBadge');
  if(badge){ badge.textContent = unreadNotifCount; badge.style.display = 'flex'; }
}
function clearNotifBadge(){
  unreadNotifCount = 0;
  const badge = document.getElementById('notifBadge');
  if(badge) badge.style.display = 'none';
}
/* الانتقال المباشر لمكان التنبيه (مريض + تبويب محدد) من أي مكان بالتطبيق */
function goToNotificationTarget(patientId, tab){
  closeNotifPanel();
  document.querySelectorAll('.in-app-toast').forEach(el => el.remove());
  if(!patientId) return;
  openPatient(patientId);
  currentTab = tab || 'tabOverview';
  render();
}
function notifKindIcon(kind, urgent){
  if(urgent) return 'ti-alert-triangle';
  return kind === 'order' ? 'ti-clipboard-list' : 'ti-notes';
}
/* شريط تنبيه داخل الصفحة نفسها - يشتغل بكل الأجهزة بلا استثناء (حتى آيفون)
   لأنه مجرد عنصر HTML عادي، مش إشعار نظام تفرضه قيود المتصفح/النظام.
   قابل للنقر - ينقل مباشرة لمكان المشكلة (المريض + التبويب المعني). */
function showInAppToast(entry){
  playAlertTone(entry.urgent);
  bumpNotifBadge();
  let wrap = document.getElementById('inAppToastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'inAppToastWrap';
    wrap.style.cssText = 'position:fixed;top:66px;inset-inline:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;';
    document.body.appendChild(wrap);
  }
  const toast = document.createElement('div');
  toast.className = 'in-app-toast';

/* ---------- نظام الورديات: يحدد بوضوح مين الممرض المسؤول عن كل مريض بأي لحظة ----------
   3 ورديات ثابتة باليوم (صباحية 8-16، مسائية 16-24، ليلية 0-8) - كل مريض عنده
   ممرض معيّن لكل وردية من الثلاث، والنظام يحسب تلقائيًا مين المسؤول "الآن"
   حسب الساعة الحالية، بدون أي لبس أو حاجة لتحديث يدوي وقت تبديل الوردية. */
const SHIFTS = [
  { key:'morning', startHour:8, endHour:16, labelKey:'shiftMorning' },
  { key:'evening', startHour:16, endHour:24, labelKey:'shiftEvening' },
  { key:'night', startHour:0, endHour:8, labelKey:'shiftNight' },
];
function getCurrentShiftKey(){
  const h = new Date().getHours();
  const shift = SHIFTS.find(s => h >= s.startHour && h < s.endHour);
  return shift ? shift.key : 'night';
}
function getCurrentShiftNurse(patient){
  if(!patient || !patient.shiftNurses) return null;
  return patient.shiftNurses[getCurrentShiftKey()] || null;
}
function isRelevantToMe(patient){
  if(!patient) return true; // احتياطًا لو ما لقينا المريض بالذاكرة المؤقتة بعد
  if(currentUser.role === 'admin') return true;
  if(patient.assignedDoctor?.uid === currentUser.id) return true;
  const shiftNurse = getCurrentShiftNurse(patient);
  return shiftNurse?.uid === currentUser.id;
}

const PUSH_WORKER_URL = 'https://mz-icu-pusha.mohammedkm519.workers.dev/';

function pushSupported(){

const VITALS_INTERVAL_HOURS = 4; // الفاصل الافتراضي المتوقع بين قياسات العلامات الحيوية
function getVitalsOverdueInfo(patientId){
  const vitals = allVitalsCache.filter(v=>v.patientId===patientId).sort((a,b)=>b.time-a.time);
  const last = vitals[0];
  const lastTime = last ? last.time : null;
  const hoursSince = lastTime ? (Date.now() - lastTime) / 3600000 : null;
  const overdue = hoursSince === null || hoursSince >= VITALS_INTERVAL_HOURS;
  return { lastTime, hoursSince, overdue };
}

function icuCalcRun(fromRate){
  const g = id => { const v = parseFloat(document.getElementById(id).value); return isFinite(v) ? v : null; };
  const mg = g('cc_mg'), ml = g('cc_ml'), wt = g('cc_wt'), dose = g('cc_dose'), rate = g('cc_rate'), unit = document.getElementById('cc_unit').value;
  const out = document.getElementById('cc_out');
  if(!mg || !ml){ out.innerHTML = `<span class="muted">${cx('fill')}</span>`; return; }
  const conc = mg / ml; // mg/mL (أو units/mL)
  const perMin = unit === 'mcgkgmin' || unit === 'mcgmin' || unit === 'ukgmin';
  const needsWt = unit === 'mcgkgmin' || unit === 'ukgmin';
  const mult = (unit === 'mcgkgmin' || unit === 'mcgmin') ? 1000 : 1; // mg → mcg
  const w = needsWt ? wt : 1;
  if(needsWt && !wt){ out.innerHTML = `<span class="muted">${cx('wt')}</span>`; return; }
  const doseToRate = d => perMin ? (d * w * 60) / (conc * mult) : d / conc;
  const rateToDose = r => perMin ? (r * conc * mult) / (w * 60) : r * conc;
  let html = `<div>${cx('conc')}: <b dir="ltr">${(conc * (mult === 1000 ? 1000 : 1)).toFixed(mult === 1000 ? 0 : 2)} ${mult === 1000 ? 'mcg/mL' : (unit === 'mgh' ? 'mg/mL' : 'units/mL')}</b></div>`;
  const uLbl = { mcgkgmin:'mcg/kg/min', mcgmin:'mcg/min', mgh:'mg/h', ukgmin:'units/kg/min', uh:'units/h' }[unit];
  if(fromRate && rate != null){
    html += `<div style="font-size:18px;margin-top:6px;">${rate} mL/h = <b dir="ltr">${rateToDose(rate).toFixed(3)} ${uLbl}</b></div>`;
  } else if(dose != null){
    html += `<div style="font-size:18px;margin-top:6px;">${dose} ${uLbl} = <b dir="ltr">${doseToRate(dose).toFixed(2)} mL/h</b></div>`;
  } else html += `<span class="muted">${cx('fill')}</span>`;
  out.innerHTML = html;
}
function icuQuickRun(){
  const g = id => { const v = parseFloat(document.getElementById(id).value); return isFinite(v) ? v : null; };
  const s = g('cq_s'), d = g('cq_d'), h = g('cq_h'), ca = g('cq_ca'), alb = g('cq_alb'), male = document.getElementById('cq_x').value === 'm';
  const parts = [];
  if(s != null && d != null) parts.push(`${cx('map')}: <b dir="ltr">${((s + 2 * d) / 3).toFixed(0)} mmHg</b>`);
  if(h){ const ibw = (male ? 50 : 45.5) + 0.91 * (h - 152.4); parts.push(`${cx('ibw')}: <b dir="ltr">${ibw.toFixed(1)} kg</b> — ${cx('tv')}: <b dir="ltr">${(ibw * 6).toFixed(0)} / ${(ibw * 8).toFixed(0)} mL</b>`); }
  if(ca != null && alb != null) parts.push(`${cx('cac')}: <b dir="ltr">${(ca + 0.8 * (4 - alb)).toFixed(2)} mg/dL</b>`);
  document.getElementById('cq_out').innerHTML = parts.length ? parts.map(x => `<div style="margin-bottom:6px;">${x}</div>`).join('') : `<span class="muted">${cx('fill')}</span>`;
}

async function createUser(){
  const username = document.getElementById('nu_username').value.trim();
  const password = document.getElementById('nu_password').value;
  const name = document.getElementById('nu_name').value.trim();
  const role = document.getElementById('nu_role').value;
  const phone = document.getElementById('nu_phone').value.trim();
  const email = document.getElementById('nu_email').value.trim().toLowerCase();
  const errEl = document.getElementById('userFormError');
  if(!username || !password){ errEl.textContent = t('username') + ' / ' + t('password'); return; }
  if(!phoneKey(phone)){ errEl.textContent = sd('phoneReq'); return; }
  errEl.textContent = '';
  try{
    // نستخدم تطبيق Firebase ثانوي حتى ما تنقطع جلسة دخول المدير الحالي
    const authEmail = email || usernameToEmail(username);
    const cred = await fbSecondaryAuth.createUserWithEmailAndPassword(authEmail, password);
    await fbSecondaryDb.collection('users').doc(cred.user.uid).set({ username, name, role, phone, email, authEmail });
    await fbSecondaryAuth.signOut();
    try{ for(const k of loginIndexKeys({ username, email, phone })) await fbDb.collection('loginIndex').doc(k).set({ authEmail }); }catch(e){ console.warn('loginIndex:', e.message); }
    document.getElementById('nu_phone').value = ''; document.getElementById('nu_email').value = '';
    document.getElementById('nu_username').value = '';
    document.getElementById('nu_password').value = '';
    document.getElementById('nu_name').value = '';
    loadAndRenderUserList();
  }catch(err){
    errEl.textContent = err.code === 'auth/email-already-in-use' ? t('userExists') : err.message;
  }
}
async function editUserContact(id){

async function deleteUser(id){

}

function csvEscape(val){
  const s = String(val==null?'':val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
async function exportSurveyCSV(){
  const statusEl = document.getElementById('exportStatus');
  try{
    const snap = await fbDb.collection('surveyResponses').orderBy('time','desc').get();
    if(snap.empty){ statusEl.innerHTML = `<p class="muted">${t('noSurveyData')}</p>`; return; }
    const header = ['datetime','respondent_name','respondent_role',
      'Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9','Q10','sus_score','grade','language'];
    const lines = [header.join(',')];
    snap.forEach(doc => {
      const d = doc.data();
      const row = [
        new Date(d.time).toISOString(),
        d.respondent?.name || '', d.respondent?.role || '',
        ...(d.answers||[]), d.score, d.grade, d.lang
      ].map(csvEscape);
      lines.push(row.join(','));
    });
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sus_survey_export_' + Date.now() + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    statusEl.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;word-break:break-all;">${(err.message||'').replace(/</g,'&lt;')}</div>`;

}

async function renderVoiceRecordings(app){
  app.innerHTML = `
    <button class="link-btn" onclick="currentPage='patients';render()"><i class="ti ti-arrow-right" style="vertical-align:-2px;"></i> ${t('backToPatients')}</button>
    <div class="warn-banner">${t('voiceRecordingsDesc')}</div>
    <h2 style="margin-top:0;">${t('voiceRecordings')}</h2>
    <div id="voiceRecordingsList"><p class="muted">...</p></div>`;
  try{
    const snap = await fbDb.collection('voiceRecordings').orderBy('time','desc').limit(100).get();
    const recs = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    const rows = recs.map(r => {
      const patient = patientsCache.find(p => p.id === r.patientId);
      return `
        <div class="card">
          <div class="flex-between">
            <span class="badge med">${r.context === 'vitals' ? t('tabVitals') : t('notesToday')}</span>
            <span class="muted">${new Date(r.time).toLocaleString(lang)}</span>
          </div>
          <p style="margin:8px 0;"><b>${t('recordingContext')}:</b> ${patient ? patient.name : '-'}</p>
          <p style="margin:8px 0;white-space:pre-wrap;">${(r.transcript||'').replace(/</g,'&lt;')}</p>
          <audio controls src="${r.audioData}" style="width:100%;"></audio>
          <div class="muted" style="font-size:12px;margin-top:6px;">${t('recordedBy')}: ${formatCreatedBy(r.createdBy)}</div>
        </div>`;
    }).join('');
    document.getElementById('voiceRecordingsList').innerHTML = rows || `<p class="muted">${t('noRecordings')}</p>`;
  }catch(err){
    document.getElementById('voiceRecordingsList').innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;word-break:break-all;">${(err.message||'').replace(/</g,'&lt;')}</div>`;
  }
}

function chipLabel(o){ return (lang === 'en' ? o.en : (o[lang] || o.ar)); }
function chipEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function chipPickerHtml(id, label, key){
  const opts = CHIP_LISTS[key].map(o =>
    `<button type="button" class="chip" data-v="${chipEsc(o.en)}"${(o.en==='NKDA'||/^No /.test(o.en))?' data-x="1"':''} onclick="chipToggle(this)">${chipEsc(chipLabel(o))}</button>`
  ).join('');
  return `<div class="field" style="grid-column:1/-1;"><label>${label}</label>
    <div class="chips" id="${id}">${opts}</div>
    <div class="chip-add"><input id="${id}_other" placeholder="${t('addOther')}" onkeydown="if(event.key==='Enter'){event.preventDefault();chipAddCustom('${id}');}">
      <button type="button" class="secondary" onclick="chipAddCustom('${id}')">${t('addBtn')}</button></div></div>`;
}
function chipToggle(btn){
  const on = !btn.classList.contains('on');
  if(on && btn.dataset.x){ btn.parentNode.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on')); }
  else if(on){ btn.parentNode.querySelectorAll('.chip.on[data-x]').forEach(c => c.classList.remove('on')); }
  btn.classList.toggle('on', on);
}
function chipAddCustom(id){
  const inp = document.getElementById(id + '_other');
  const v = (inp.value || '').trim();
  if(!v) return;
  const box = document.getElementById(id);
  box.querySelectorAll('.chip.on[data-x]').forEach(c => c.classList.remove('on'));
  const exist = Array.from(box.querySelectorAll('.chip')).find(c => c.dataset.v.toLowerCase() === v.toLowerCase());
  if(exist){ exist.classList.add('on'); }
  else {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip on'; b.dataset.v = v; b.textContent = v;
    b.onclick = function(){ chipToggle(b); };
    box.appendChild(b);
  }
  inp.value = '';
}
function chipValue(id){
  return Array.from(document.querySelectorAll('#' + id + ' .chip.on')).map(c => c.dataset.v).join(', ');
}

/* ---------- رمز QR: لكل مريض رمز فريد يفتح ملفه مباشرة (بدل التصفح اليدوي) ---------- */
function showPatientQR(patientId){
  const wrap = document.getElementById('qrDisplayWrap');
  if(wrap.innerHTML){ wrap.innerHTML = ''; return; }
  if(typeof QRCode === 'undefined'){ wrap.innerHTML = `<p class="muted" style="color:var(--danger);">QR library failed to load</p>`; return; }
  const canvas = document.createElement('canvas');
  QRCode.toCanvas(canvas, 'MZICU:'+patientId, { width:170, margin:1 }, function(err){
    if(err){ wrap.innerHTML = `<p class="muted" style="color:var(--danger);">${err.message}</p>`; return; }
    wrap.innerHTML = '';
    wrap.appendChild(canvas);
  });
}

let qrScanStream = null, qrScanInterval = null;
function startQRScan(){
  if(document.getElementById('qrScanModal')) return;
  const modal = document.createElement('div');
  modal.id = 'qrScanModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(10,20,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;';
  modal.innerHTML = `
    <p style="color:#fff;text-align:center;">${t('qrScanTitle')}</p>
    <video id="qrVideo" style="width:100%;max-width:400px;border-radius:10px;background:#000;" playsinline></video>
    <p id="qrScanStatus" style="color:#F5C6C4;min-height:20px;text-align:center;"></p>
    <button class="secondary" onclick="stopQRScan()">${t('closeCam')}</button>
  `;
  document.body.appendChild(modal);
  const video = document.getElementById('qrVideo');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
    qrScanStream = stream;
    video.srcObject = stream;
    video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    qrScanInterval = setInterval(() => {
      if(!video.videoWidth) return;
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code){
        const match = code.data.match(/^MZICU:(.+)$/);
        const patient = match ? patientsCache.find(p=>p.id===match[1]) : null;
        if(patient){ stopQRScan(); openPatient(patient.id); }
        else { document.getElementById('qrScanStatus').textContent = t('qrNotFound'); }
      }
    }, 300);
  }).catch(err => {
    document.getElementById('qrScanStatus').textContent = err.message;
  });
}
function stopQRScan(){
  if(qrScanInterval){ clearInterval(qrScanInterval); qrScanInterval = null; }
  if(qrScanStream){ qrScanStream.getTracks().forEach(t=>t.stop()); qrScanStream = null; }
  const modal = document.getElementById('qrScanModal');
  if(modal) modal.remove();
}

/* ================= ABG / VBG: محرك التفسير (قواعد ثابتة قابلة للتدقيق) ================= */
function abgNum(v){ if(v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function abgRound(x, d){ const m = Math.pow(10, d == null ? 1 : d); return Math.round(x * m) / m; }
function abgCompute(inp){
  const venous = inp.sample === 'venous';
  const pH = abgNum(inp.ph), pco2 = abgNum(inp.pco2);
  if(pH == null || pco2 == null) return { error:'NEED_PH_PCO2' };
  const r = { venous, input:{}, disorders:[], flags:[], critical:[], compNote:null, oxy:null };
  let hco3 = abgNum(inp.hco3);
  r.hco3Calc = false;
  const aPH = venous ? pH + 0.03 : pH;           // معادل شرياني تقريبي للوريدي
  const aCO2 = venous ? pco2 - 5 : pco2;
  if(hco3 == null){ hco3 = 0.0307 * aCO2 * Math.pow(10, aPH - 6.1); r.hco3Calc = true; }
  Object.assign(r.input, { pH, pco2, hco3: abgRound(hco3, 1), aPH: abgRound(aPH, 2), aCO2: abgRound(aCO2, 0) });
  const Na = abgNum(inp.na), Cl = abgNum(inp.cl), K = abgNum(inp.k), alb = abgNum(inp.alb), lac = abgNum(inp.lactate), glu = abgNum(inp.glucose);
  const pao2 = abgNum(inp.pao2), fio2 = abgNum(inp.fio2);

  const loHCO3 = hco3 < 22, hiHCO3 = hco3 > 26, hiCO2 = aCO2 > 45, loCO2 = aCO2 < 35;
  let primary = 'normal';
  if(aPH < 7.40){
    if(loHCO3 && hiCO2) primary = 'mixed_acid'; else if(loHCO3) primary = 'met_acid'; else if(hiCO2) primary = 'resp_acid';
    else primary = aPH < 7.35 ? 'unexplained_acid' : 'normal';
  }else{
    if(hiHCO3 && loCO2) primary = 'mixed_alk'; else if(hiHCO3) primary = 'met_alk'; else if(loCO2) primary = 'resp_alk';
    else primary = aPH > 7.45 ? 'unexplained_alk' : 'normal';
  }
  // pH شبه طبيعي مع انخفاض/ارتفاع HCO3 وpCO2 معاً: نحدد الاضطراب الأولي بمعادلات التعويض
  if(aPH >= 7.35 && aPH <= 7.45){
    if(loHCO3 && loCO2){ primary = 'met_acid'; }
    else if(hiHCO3 && hiCO2){
      const e = 40 + 0.7 * (hco3 - 24);
      primary = Math.abs(aCO2 - e) <= 5 ? 'met_alk' : 'resp_acid';
    }
  }
  r.primary = primary;
  const add = d => { if(r.disorders.indexOf(d) < 0) r.disorders.push(d); };
  r.phState = aPH < 7.35 ? 'acidemia' : aPH > 7.45 ? 'alkalemia' : 'normal';

  if(primary === 'met_acid' || primary === 'mixed_acid'){
    add('met_acid');
    if(primary === 'mixed_acid') add('resp_acid');
    const exp = 1.5 * hco3 + 8; r.expCO2 = [abgRound(exp - 2, 1), abgRound(exp + 2, 1)];
    if(primary !== 'mixed_acid'){
      if(aCO2 > exp + 2) { add('resp_acid'); r.comp = 'inadequate'; }
      else if(aCO2 < exp - 2) { add('resp_alk'); r.comp = 'excess'; }
      else r.comp = 'appropriate';
    }
  }else if(primary === 'resp_acid'){
    add('resp_acid');
    const acute = 24 + 0.1 * (aCO2 - 40), chronic = 24 + 0.35 * (aCO2 - 40);
    r.expHCO3 = [abgRound(acute, 1), abgRound(chronic, 1)];
    if(hco3 < acute - 2){ add('met_acid'); r.comp = 'mixed'; }
    else if(hco3 > chronic + 2){ add('met_alk'); r.comp = 'mixed'; }
    else if(hco3 <= acute + 2) r.comp = 'acute';
    else if(hco3 >= chronic - 2) r.comp = 'chronic';
    else r.comp = 'acute_on_chronic';
  }else if(primary === 'met_alk' || primary === 'mixed_alk'){
    add('met_alk');
    if(primary === 'mixed_alk') add('resp_alk');
    const exp = 40 + 0.7 * (hco3 - 24); r.expCO2 = [abgRound(exp - 5, 1), abgRound(exp + 5, 1)];
    if(primary !== 'mixed_alk'){
      if(aCO2 > exp + 5){ add('resp_acid'); r.comp = 'excess'; }
      else if(aCO2 < exp - 5){ add('resp_alk'); r.comp = 'inadequate'; }
      else r.comp = 'appropriate';
    }
  }else if(primary === 'resp_alk'){
    add('resp_alk');
    const acute = 24 - 0.2 * (40 - aCO2), chronic = 24 - 0.5 * (40 - aCO2);
    r.expHCO3 = [abgRound(chronic, 1), abgRound(acute, 1)];
    if(hco3 > acute + 2){ add('met_alk'); r.comp = 'mixed'; }
    else if(hco3 < chronic - 2){ add('met_acid'); r.comp = 'mixed'; }
    else if(hco3 >= acute - 2) r.comp = 'acute';
    else if(hco3 <= chronic + 2) r.comp = 'chronic';
    else r.comp = 'subacute';
  }

  // الفجوة الأيونية
  if(Na != null && Cl != null){
    const ag = Na - Cl - hco3;
    const agc = alb != null ? ag + 2.5 * (4 - alb) : ag;
    r.ag = { raw: abgRound(ag, 1), corrected: alb != null ? abgRound(agc, 1) : null, used: abgRound(agc, 1), high: agc > 12, albUsed: alb != null };
    const hasMetAcid = r.disorders.indexOf('met_acid') >= 0;
    const dHCO3 = 24 - hco3, dAG = agc - 12;
    if(dHCO3 > 0) r.ag.delta = abgRound(dAG / dHCO3, 2);
    if(r.ag.high){
      if(!hasMetAcid) add('met_acid');
      if(r.ag.delta == null){ add('hagma'); add('met_alk'); }
      else if(r.ag.delta < 0.4){ add('nagma'); if(agc > 16) add('hagma'); }
      else if(r.ag.delta < 0.8){ add('hagma'); add('nagma'); }
      else if(r.ag.delta <= 2){ add('hagma'); }
      else { add('hagma'); add('met_alk'); }
    }else if(hasMetAcid){ add('nagma'); }
  }else if(r.disorders.indexOf('met_acid') >= 0){ r.flags.push('NO_AG_INPUT'); }

  if(r.primary === 'normal' && r.disorders.length > 1) r.flags.push('MASKED_MIXED');
  // اللاكتات
  if(lac != null){ r.lactate = { v: lac, high: lac > 2, severe: lac >= 4 }; }
  // الأكسجة (شرياني فقط)
  if(!venous && pao2 != null){
    const o = { pao2, fio2: fio2 };
    o.level = pao2 < 60 ? 'severe' : pao2 < 80 ? 'mild' : pao2 > 120 ? 'hyperoxia' : 'normal';
    if(fio2 != null && fio2 >= 21 && fio2 <= 100){
      o.pf = abgRound(pao2 / (fio2 / 100), 0);
      o.pfBand = o.pf >= 300 ? 'ge300' : o.pf >= 200 ? '200_299' : o.pf >= 100 ? '100_199' : 'lt100';
      o.aa = abgRound((fio2 / 100) * (760 - 47) - pco2 / 0.8 - pao2, 0);
    }
    r.oxy = o;
  }
  // قيم حرجة
  if(aPH < 7.10 || aPH > 7.60) r.critical.push('pH');
  if(pco2 > 80 || pco2 < 20) r.critical.push('pCO2');
  if(hco3 < 10) r.critical.push('HCO3');
  if(!venous && pao2 != null && pao2 < 40) r.critical.push('PaO2');
  if(lac != null && lac >= 4) r.critical.push('lactate');
  if(K != null && (K < 2.5 || K > 6.5)) r.critical.push('K');
  if(Na != null && (Na < 120 || Na > 160)) r.critical.push('Na');
  if(K != null){ r.k = K; }
  if(glu != null){ r.glucose = glu; }
  if(Na != null) r.na = Na;
  return r;
}

 met_alk:['حساس به کلر: حجم را با نرمال سالین 0.9٪ برگردانید، پتاسیم (KCl) و منیزیم جایگزین کنید، مدرهای لوپ/ساکشن NG بیش‌ازحد را در صورت امکان قطع یا کم کنید، PPI/درناژ معده را بازبینی کنید.','مقاوم به کلر: علت را درمان کنید (هیپرآلدوسترونیسم، کوشینگ و...) و غدد را درگیر کنید.','آلکالوز شدید (pH > 7.55) یا بیمار دچار اضافه‌بار حجمی: استازولامید همراه جایگزینی پتاسیم می‌تواند کمک کند؛ به‌ندرت HCl وریدی یا درمان جایگزین کلیه.','روی ونتیلاتور: pCO2 را بیش‌ازحد پایین نیاورید؛ اهداف را بازبینی کنید.','فشار خون، پتاسیم، منیزیم و کلسیم یونیزه را پایش کنید.'],
