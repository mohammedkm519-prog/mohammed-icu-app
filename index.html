function abgFaVerdict(r){
  const d = r.disorders;
  if(!d.length) return 'گاز خون در محدوده طبیعی است (اختلال اسید-باز واضحی دیده نمی‌شود).';
  const parts = [];
  d.forEach(x => {
    if(x === 'hagma' || x === 'nagma') return;
    let name = ABG_FA_NAMES[x];
    if(x === 'met_acid'){ if(d.indexOf('hagma') >= 0 && d.indexOf('nagma') >= 0) name += ' مختلط (آنیون گپ بالا + طبیعی)'; else if(d.indexOf('hagma') >= 0) name += ' ' + ABG_FA_NAMES.hagma; else if(d.indexOf('nagma') >= 0) name += ' ' + ABG_FA_NAMES.nagma; }
    parts.push(name);
  });
  const inad = (r.comp === 'inadequate' && d.indexOf('met_acid') >= 0) ? ' (جبران تنفسی ناکافی)' : '';
  return (d.length > 1 ? 'اختلال مختلط: ' : '') + parts.join(' + ') + inad + '.';
}
function abgFaSteps(r){
  const out = []; const i = r.input;
  if(r.venous) out.push(`نمونه وریدی: معادل شریانی تقریبی pH ≈ ${i.aPH} و pCO2 ≈ ${i.aCO2} (pH وریدی حدود 0.03 کمتر و pCO2 حدود 5 بیشتر است). فقط یک تخمین است؛ اکسیژن‌رسانی از نمونه وریدی قابل ارزیابی نیست و در شوک یا ایست قلبی اعتبار آن کمتر است.`);
  out.push(`گام 1 — وضعیت pH: ${r.phState === 'acidemia' ? 'اسیدمی (Acidemia)' : r.phState === 'alkalemia' ? 'آلکالمی (Alkalemia)' : 'در محدوده طبیعی 7.35–7.45'} (pH ${i.aPH}).`);
  out.push(`گام 2 — اختلال اولیه: pCO2 = ${i.aCO2} ${i.aCO2 > 45 ? '(بالا)' : i.aCO2 < 35 ? '(پایین)' : '(طبیعی)'}، HCO3 = ${i.hco3} ${i.hco3 < 22 ? '(پایین)' : i.hco3 > 26 ? '(بالا)' : '(طبیعی)'}${r.hco3Calc ? ' (محاسبه‌شده با معادله هندرسون-هاسلباخ)' : ''}. مؤلفه‌ای که با جهت pH هم‌خوان است اولیه است ← ${r.primary === 'normal' ? 'اختلال اولیه واضحی وجود ندارد' : (r.disorders[0] ? ABG_FA_NAMES[r.disorders[0]] : '')}.`);
  const c = r.comp;
  if(c){
    let s = '';
    if(r.expCO2) s = `pCO2 مورد انتظار با جبران = ${r.expCO2[0]}–${r.expCO2[1]} (${(r.primary==='met_acid'||r.primary==='mixed_acid') ? 'فرمول Winter: 1.5×HCO3+8 ±2' : 'آلکالوز متابولیک: 40+0.7×(HCO3−24) ±5'}); مقدار اندازه‌گیری‌شده ${i.aCO2}.`;
    else if(r.expHCO3) s = `HCO3 مورد انتظار: ${r.expHCO3[0]}–${r.expHCO3[1]}؛ اندازه‌گیری‌شده ${i.hco3}.`;
    const cm = { appropriate:'جبران مناسب ← اختلال ساده.', inadequate:'جبران ناکافی ← اختلال تنفسی همزمان (کم‌تهویه‌ای یا خستگی).', excess:'جبران بیش‌ازحد ← اختلال تنفسی همزمان (تهویه اضافی).', mixed:'خارج از محدوده جبران ← اختلال متابولیک همزمان (مختلط).', acute:'شدت زمانی: حاد (جبران کلیوی هنوز کامل نشده؛ ساعت‌ها تا روزها).', chronic:'شدت زمانی: مزمن (جبران کلیوی کامل، بیش از 3–5 روز) — به بیماری مزمن ریه/عصبی-عضلانی یا سازگاری فکر کنید.', acute_on_chronic:'شدت زمانی: حاد بر مزمن (HCO3 بین حد حاد و مزمن) — مثل تشدید COPD.', subacute:'شدت زمانی: تحت‌حاد.' };
    out.push('گام 3 — جبران و شدت زمانی: ' + s + ' ' + (cm[c] || ''));
  }
  if(r.ag){
    const a = r.ag;
    out.push(`گام 4 — آنیون گپ: AG = Na − Cl − HCO3 = ${a.raw}${a.corrected != null ? `، اصلاح‌شده با آلبومین = ${a.corrected}` : ' (آلبومین وارد نشده، اصلاح انجام نشد)'} (طبیعی 8–12). ${a.high ? 'بالا ← اسید اندازه‌گیری‌نشده وجود دارد.' : 'طبیعی.'}${a.delta != null && a.high ? ` نسبت دلتا = (AG−12)/(24−HCO3) = ${a.delta}: ${a.delta < 0.4 ? 'کمتر از 0.4 ← غلبه اسیدوز هیپرکلرمیک' : a.delta < 0.8 ? '0.4–0.8 ← اسیدوز مختلط (گپ بالا + طبیعی)' : a.delta <= 2 ? '0.8–2 ← اسیدوز خالص با گپ بالا' : 'بیش از 2 ← آلکالوز متابولیک همزمان یا HCO3 بالا از قبل'}.` : ''}`);
  } else if(r.flags.indexOf('NO_AG_INPUT') >= 0){
    out.push('گام 4 — آنیون گپ: برای تعیین نوع و علل اسیدوز متابولیک، Na و Cl (و آلبومین) را وارد کنید.');
  }
  if(r.lactate){
    out.push(`لاکتات ${r.lactate.v} mmol/L: ${r.lactate.severe ? 'بسیار بالا (≥ 4) ← تا اثبات خلاف، کاهش پرفیوژن/شوک' : r.lactate.high ? 'بالا (> 2) ← هیپرلاکتاتمی' : 'طبیعی'}.${r.ag && r.ag.high && !r.lactate.high ? ' گپ بالا با لاکتات طبیعی ← به‌دنبال کتون، اورمی و سموم بگردید.' : ''}`);
  }
  if(r.oxy){
    const o = r.oxy;
    out.push(`اکسیژن‌رسانی: PaO2 = ${o.pao2} mmHg (${o.level === 'severe' ? 'هیپوکسمی شدید < 60' : o.level === 'mild' ? 'هیپوکسمی خفیف 60–79' : o.level === 'hyperoxia' ? 'هیپراکسی > 120' : 'طبیعی'})${o.pf != null ? `؛ PaO2/FiO2 = ${o.pf} (${o.pfBand === 'ge300' ? '≥ 300 طبیعی/خفیف' : o.pfBand === '200_299' ? '200–299: در محدوده ARDS خفیف در صورت وجود معیارها' : o.pfBand === '100_199' ? '100–199: در محدوده ARDS متوسط در صورت وجود معیارها' : '< 100: در محدوده ARDS شدید در صورت وجود معیارها'})؛ گرادیان A–a = ${o.aa} mmHg (طبیعی روی هوای اتاق < 15–25 بسته به سن؛ افزایش آن نشانه اختلال تبادل گاز است)` : ''}.`);
  }
  return out;
}

function abgVerdict(r){
  const L = abgL(); if(L === 'fa') return abgFaVerdict(r); const d = r.disorders;
  if(!d.length){ return L === 'ar' ? 'غاز دم ضمن الحدود الطبيعية (لا اضطراب حمضي-قاعدي ظاهر).' : 'Blood gas within normal limits (no evident acid–base disorder).'; }
  const parts = [];

    if(x === 'hagma' || x === 'nagma') return;
    let name = ABG_NAMES[x][L];
    if(x === 'met_acid'){ if(d.indexOf('hagma') >= 0 && d.indexOf('nagma') >= 0) name += L === 'ar' ? ' مختلط (فجوة مرتفعة + طبيعية)' : ' mixed (high + normal gap)'; else if(d.indexOf('hagma') >= 0) name += ' ' + ABG_NAMES.hagma[L]; else if(d.indexOf('nagma') >= 0) name += ' ' + ABG_NAMES.nagma[L]; }

  });
  const joined = parts.join(L === 'ar' ? ' + ' : ' + ');
  const inad = (r.comp === 'inadequate' && d.indexOf('met_acid') >= 0) ? (L === 'ar' ? ' (تعويض تنفسي غير كافٍ)' : ' (inadequate respiratory compensation)') : '';

function sparklineSvg(values, color){
  const vals = values.filter(v=>v!=null && !isNaN(v));
  if(vals.length < 2) return `<span class="muted" style="font-size:11px;">--</span>`;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const w = 120, h = 34, step = w / (vals.length - 1);
  const points = vals.map((v,i) => `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h*0.85 - 3).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:120px;height:34px;overflow:visible;">
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- الإدخال الصوتي للعلامات الحيوية (محلي بدون ذكاء اصطناعي) ----------
   1) تعرّف مستمر على الكلام (يستمر حتى تضغط إيقاف) مع عرض النص فورًا.
   2) محلّل قواعد محلي يفهم الأرقام (٠-٩ / ۰-۹ / كلمات عربي-فارسي-تركي-إنجليزي) وأسماء العلامات.
   3) بديل: الكتابة أو الإملاء من لوحة المفاتيح بنفس الصيغة. الذكاء الاصطناعي صار احتياطيًا فقط. */
function vmNorm(s){
  s = String(s == null ? '' : s).toLowerCase().replace(/i̇/g, 'i');
  s = s.replace(/[ً-ْٰـ]/g, '')
       .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
       .replace(/ی/g, 'ي').replace(/ک/g, 'ك').replace(/ؤ/g, 'و');
  s = s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
       .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0));
  s = s.replace(/٫/g, '.').replace(/(\d)\s*[,،]\s*(\d)/g, '$1.$2').replace(/[,،;؛:!?؟]/g, ' ');
  s = s.replace(/(\d)\s*٪|%/g, '$1 ').replace(/°|º/g, ' ');
  return s.replace(/\s+/g, ' ').trim();
}
const VM_EN = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const VM_AR = {صفر:0,واحد:1,احد:1,اثنين:2,اثنان:2,اثنتين:2,اثنا:2,ثنين:2,ثلاثه:3,ثلاث:3,اربعه:4,اربع:4,خمسه:5,خمس:5,سته:6,ست:6,سبعه:7,سبع:7,ثمانيه:8,ثمان:8,ثماني:8,تسعه:9,تسع:9,عشره:10,عشرين:20,ثلاثين:30,اربعين:40,خمسين:50,ستين:60,سبعين:70,ثمانين:80,تسعين:90,ميه:100,مئه:100,مائه:100,مايه:100,ميت:100,مئتين:200,ميتين:200,مئتان:200};
const VM_FA = {صفر:0,يك:1,دو:2,سه:3,چهار:4,پنج:5,شش:6,هفت:7,هشت:8,نه:9,ده:10,يازده:11,دوازده:12,سيزده:13,چهارده:14,پانزده:15,شانزده:16,هفده:17,هجده:18,نوزده:19,بيست:20,سي:30,چهل:40,پنجاه:50,شصت:60,هفتاد:70,هشتاد:80,نود:90,صد:100,دويست:200,سيصد:300,چهارصد:400,پانصد:500};
const VM_TR = {sıfır:0,bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9,on:10,yirmi:20,otuz:30,kırk:40,elli:50,altmış:60,yetmiş:70,seksen:80,doksan:90,yüz:100};
const VM_DEC = ['point','نقطه','فاصله','ممیز','nokta','virgül'];
const VM_CONN = ['and','و','ve'];
function vmNumWordMap(lg){
  const src = Object.assign({}, VM_EN);
  if(lg === 'ar') Object.assign(src, VM_AR);
  if(lg === 'fa') Object.assign(src, VM_FA);
  if(lg === 'tr') Object.assign(src, VM_TR);
  const out = {};
  Object.keys(src).forEach(k => { out[vmNorm(k)] = src[k]; });
  return out;
}
function vmWordsToDigits(text, lg){
  const map = vmNumWordMap(lg);
  const J = vmNorm('عشر');            // "ثلاثة عشر" = 13
  const tok = text.split(' ').filter(Boolean);
  const isW = w => {
    if(w === J) return 'J';
    if(w in map) return map[w];
    if(w[0] === 'و' && w.length > 2){ const r = w.slice(1); if(r === J) return 'J'; if(r in map) return map[r]; }
    return undefined;
  };
  const out = [];
  for(let i = 0; i < tok.length; ){
    let v = isW(tok[i]);
    if(v === undefined || v === 'J'){ out.push(tok[i]); i++; continue; }
    let total = 0, cur = 0, usedHundred = false, firstUnit = null;
    let j = i, count = 0;
    while(j < tok.length){
      const w = tok[j];
      let val = isW(w);
      if(val === undefined && VM_CONN.indexOf(w) >= 0 && j + 1 < tok.length && isW(tok[j+1]) !== undefined){ j++; continue; }
      if(val === undefined) break;
      if(val === 'J'){ if(cur >= 1 && cur <= 9) cur += 10; j++; count++; continue; }
      if(val === 100){ cur = cur ? cur * 100 : 100; total += cur; cur = 0; usedHundred = true; }
      else {
        if(lg !== 'ar' && lg !== 'fa' && lg !== 'tr' && cur === 1 && val >= 10 && !usedHundred && count === 1) cur = 100 + val;   // "one twenty" = 120
        else cur += val;
      }
      if(count === 0 && val < 10) firstUnit = val;
      j++; count++;
    }
    let num = String(total + cur);
    // الكسر العشري: "سبعة وثلاثين فاصلة خمسة" / "thirty seven point five"
    if(j < tok.length - 1 && VM_DEC.map(vmNorm).indexOf(tok[j]) >= 0){
      let k = j + 1, digits = '';
      while(k < tok.length){ const d = isW(tok[k]); if(typeof d === 'number' && d >= 0 && d <= 9){ digits += d; k++; } else break; }
      if(digits){ num += '.' + digits; j = k; }
    }
    out.push(num); i = j;
  }
  return out.join(' ');
}
const VM_KW = {
  bp:    ['ضغط','فشار','فشار خون','blood pressure','pressure','bp','tansiyon','tansiyonu'],
  pulse: ['نبض','نبضات','ضربان','ضربات القلب','قلب','نبض القلب','heart rate','pulse','heart','hr','nabız','nabiz','kalp'],
  temp:  ['درجه الحراره','حراره','حرارتو','حراره الجسم','تب','دما','دماي بدن','temperature','temp','ateş','ates','sıcaklık','derece'],
  spo2:  ['اشباع الاكسجين','اكسجين','اوكسجين','اوكسيجين','اكسيجين','اشباع','تشبع','اكسيژن','اس بي او تو','سبو تو','سبو','spo2','sp o2','spo 2','saturation','sat','oxygen','satürasyon','saturasyon','oksijen'],
  rr:    ['معدل التنفس','التنفس','تنفس','نفس','تنفسات','respiratory rate','respiration','respiratory','breathing','resp','rr','solunum','nefes']
};
const VM_RANGE = { sys:[50,260], dia:[20,160], pulse:[20,250], temp:[30,44], spo2:[50,100], rr:[4,60] };
function vmFits(f, n){ const r = VM_RANGE[f]; return n >= r[0] && n <= r[1]; }
function vmFix(f, n){
  if(f === 'temp'){
    if(vmFits('temp', n)) return n;
    if(n >= 300 && n <= 440) return n / 10;     // "375" -> 37.5
    return null;
  }
  return vmFits(f, n) ? n : null;
}
function parseVitalsLocal(raw, lg){
  let s = vmNorm(raw);
  // "120 على 80" / "120 over 80" / "120 روی 80" => 120/80
  s = s.replace(/\s(?:على|علي|علی|over|روي|روی|روى|üzeri|üzerine|bölü)\s/g, ' / ');
  s = vmWordsToDigits(s, lg);
  const res = {};
  // أزواج الضغط الصريحة 120/80
  const pair = s.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
  if(pair){
    let a = Number(pair[1]), b = Number(pair[2]);
    if(a < b){ const t0 = a; a = b; b = t0; }
    const sy = vmFix('sys', a), di = vmFix('dia', b);
    if(sy != null && di != null){ res.bp_sys = sy; res.bp_dia = di; s = s.replace(pair[0], ' '); }
  }
  // ابنِ قائمة أحداث: كلمات مفتاحية وأرقام بترتيبها
  const kwList = [];
  Object.keys(VM_KW).forEach(f => VM_KW[f].forEach(k => kwList.push([vmNorm(k), f])));
  kwList.sort((a, b) => b[0].length - a[0].length);
  const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const kwRe = '(?:ال)?(?:' + kwList.map(k => esc(k[0])).join('|') + ')';
  const re = new RegExp('(?<![\\p{L}\\p{N}])(' + kwRe + ')(?![\\p{L}\\p{N}])|(\\d+(?:\\.\\d+)?)', 'gu');
  const kwMap = {}; kwList.forEach(k => { if(!(k[0] in kwMap)) kwMap[k[0]] = k[1]; });
  let m, waiting = null, orphan = null, bpFirst = null;
  const fieldOf = f => ({ bp:'bp_sys', pulse:'pulse', temp:'temp', spo2:'spo2', rr:'rr' }[f]);
  const assign = (f, n) => {
    if(f === 'bp'){
      if(res.bp_sys == null){ const v = vmFix('sys', n); if(v != null){ res.bp_sys = v; return 'bp2'; } return null; }
      if(res.bp_dia == null){ const v = vmFix('dia', n); if(v != null && v < res.bp_sys){ res.bp_dia = v; return 'done'; } }
      return null;
    }
    const key = fieldOf(f); if(res[key] != null) return null;
    const v = vmFix(f, n); if(v == null) return null;
    res[key] = v; return 'done';
  };
  while((m = re.exec(s)) !== null){
    if(m[1]){
      let name = m[1].replace(/^ال/, ''); let f = kwMap[m[1]] || kwMap[name];
      if(!f) continue;
      if(orphan != null){
        const r = assign(f, orphan);
        if(r){ orphan = null; waiting = (r === 'bp2') ? 'bp' : null; continue; }
      }
      waiting = f;
    } else {
      const n = Number(m[2]);
      if(waiting){
        const r = assign(waiting, n);
        if(r === 'bp2'){ continue; }
        if(r){ waiting = null; continue; }
        if(waiting === 'bp' && res.bp_sys != null){ waiting = null; }
      }
      orphan = n;
    }
  }
  return res;
}
function vmSummary(v){
  const parts = [];
  if(v.bp_sys != null) parts.push(`${t('bp')} ${v.bp_sys}${v.bp_dia != null ? '/' + v.bp_dia : ''}`);
  if(v.pulse != null) parts.push(`${t('pulse')} ${v.pulse}`);
  if(v.temp != null) parts.push(`${t('temp')} ${v.temp}`);
  if(v.spo2 != null) parts.push(`SpO2 ${v.spo2}`);
  if(v.rr != null) parts.push(`${t('rr')} ${v.rr}`);
  return parts.join(' • ');
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onLabImageSelected(patientId, inputEl){
  const statusEl = document.getElementById('labExtractStatus');
  const reviewEl = document.getElementById('labExtractReview');
  reviewEl.innerHTML = '';
  const cfg = getAiConfig();
  if(!cfg.apiKey){
    statusEl.innerHTML = `<p class="muted" style="color:var(--danger);">${t('noApiKey')}</p>`;
    inputEl.value = '';
    return;
  }
  const file = inputEl.files[0];
  if(!file) return;
  statusEl.innerHTML = `<p class="muted"><i class="ti ti-loader-2"></i> ${t('extracting')}</p>`;
  try{
    const base64 = await fileToBase64(file);
    const results = await extractLabsFromImage(base64);
    statusEl.innerHTML = '';
    inputEl.value = '';
    if(!results.length){
      statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('extractError')}</p>`;
      return;
    }
    renderLabExtractReview(patientId, results);
  }catch(err){
    statusEl.innerHTML = `<p class="muted" style="color:var(--danger);">${t('extractError')}</p>
      <div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message||'').replace(/</g,'&lt;')}</div>`;

  }
}

    }

function updateDoseCalc(){
  const weightEl = document.getElementById('dc_weight');
  if(!weightEl) return;
  const weight = Number(weightEl.value);
  const perKg = Number(document.getElementById('dc_perkg').value);
  const unit = document.getElementById('dc_unit').value;
  const freq = Number(document.getElementById('o_freq').value) || 1;
  const totalEl = document.getElementById('dc_total');
  const perDoseEl = document.getElementById('dc_perdose');
  const perDoseWrap = document.getElementById('dc_perdose_wrap');
  if(!weight || !perKg){ totalEl.textContent = '--'; perDoseEl.textContent = '--'; return; }
  const total = Math.round(weight * perKg * 100) / 100;
  const isRate = unit.includes('/min') || unit.includes('/hr');
  totalEl.textContent = total + ' ' + unit.replace('/kg','');
  if(isRate){
    perDoseWrap.style.display = 'none';
  } else {
    perDoseWrap.style.display = '';
    const perDose = Math.round((total / freq) * 100) / 100;
    perDoseEl.textContent = perDose + ' ' + unit.replace('/kg','') + ' × ' + freq;
  }
}
function applyCalculatedDose(){

/* ---------- الملخص الذكي: جدول زمني يومي دقيق ----------
   التواريخ، الأدوية المبدوءة، والأرقام كلها تُحسب مباشرة من بياناتك
   الفعلية بكود ثابت (مش من تخمين الذكاء الاصطناعي) لضمان الدقة الكاملة.
   الذكاء الاصطناعي دوره الوحيد: يكتب جملة توضيحية قصيرة لكل يوم بس. */

function buildDayGroups(p, db){
  const firstVitalTime = db.vitals.filter(v=>v.patientId===p.id).sort((a,b)=>a.time-b.time)[0]?.time;
  const anchor = p.admittedAt || firstVitalTime || Date.now();
  const day0 = new Date(anchor); day0.setHours(0,0,0,0);
  const dayMs = 86400000;
  const dayIndexOf = (ts) => Math.floor((ts - day0.getTime()) / dayMs);

  const buckets = {};
  const ensure = (idx) => {
    if(!buckets[idx]) buckets[idx] = { dayIndex: idx, date: new Date(day0.getTime() + idx*dayMs), vitals:[], labs:[], orders:[], notes:[], io:[] };
    return buckets[idx];
  };
  db.vitals.filter(v=>v.patientId===p.id).forEach(v => ensure(dayIndexOf(v.time)).vitals.push(v));
  db.labs.filter(l=>l.patientId===p.id).forEach(l => ensure(dayIndexOf(l.time)).labs.push(l));
  db.orders.filter(o=>o.patientId===p.id).forEach(o => ensure(dayIndexOf(o.time)).orders.push(o));
  db.notes.filter(n=>n.patientId===p.id).forEach(n => ensure(dayIndexOf(n.time)).notes.push(n));
  (db.io||[]).filter(x=>x.patientId===p.id).forEach(x => ensure(dayIndexOf(x.time)).io.push(x));
  ensure(0); // يوم الدخول يظهر دائمًا حتى لو ما فيه أحداث مسجّلة

  return Object.values(buckets).sort((a,b)=>a.dayIndex-b.dayIndex).map(day => {
    const range = (arr, key) => { const vals = arr.map(x=>x[key]).filter(x=>x!=null); return vals.length ? [Math.min(...vals), Math.max(...vals)] : null; };
    const totalIn = day.io.filter(x=>x.direction==='intake').reduce((s,x)=>s+Number(x.amount||0),0);
    const totalOut = day.io.filter(x=>x.direction==='output').reduce((s,x)=>s+Number(x.amount||0),0);
    const shiftOf = (ts) => { const h = new Date(ts).getHours(); return h >= 16 ? 'evening' : h >= 8 ? 'morning' : 'night'; };
    const shifts = ['evening','morning','night'].map(sh => {
      const f = arr => arr.filter(x => shiftOf(x.time) === sh);
      const v = f(day.vitals), l = f(day.labs), o = f(day.orders), n = f(day.notes), io = f(day.io);
      const inn = io.filter(x=>x.direction==='intake').reduce((a,x)=>a+Number(x.amount||0),0), out = io.filter(x=>x.direction==='output').reduce((a,x)=>a+Number(x.amount||0),0);
      return { key: sh, vitalsCount: v.length, bpSysRange: range(v,'bp_sys'), hrRange: range(v,'pulse'), tempRange: range(v,'temp'), spo2Range: range(v,'spo2'),
        meds: [...new Set(o.map(x=>x.medName).filter(Boolean))], labs: l.map(x=>`${x.testType}: ${x.value}`), notes: n.map(x=>x.text).filter(Boolean),
        ioBalance: io.length ? (inn - out) : null, alerts: [...new Map(v.flatMap(x => checkAlerts(x)).map(a => [a.type, a])).values()],
        peakNews2: v.length ? Math.max(...v.map(x => calcNEWS2(x))) : null,
        hasEvents: !!(v.length || l.length || o.length || n.length || io.length) };
    });
    return {
      shifts,
      dayIndex: day.dayIndex,
      dateLabel: day.date.toLocaleDateString(lang),
      isAdmission: day.dayIndex === 0,
      meds: [...new Set(day.orders.map(o=>o.medName).filter(Boolean))],
      labs: day.labs.map(l=>`${l.testType}: ${l.value}`),
      notes: day.notes.map(n=>n.text).filter(Boolean),
      vitalsCount: day.vitals.length,
      bpSysRange: range(day.vitals,'bp_sys'), hrRange: range(day.vitals,'pulse'),
      tempRange: range(day.vitals,'temp'), spo2Range: range(day.vitals,'spo2'),
      gcsRange: range(day.vitals,'gcs_total'),
      ioBalance: (day.io.length ? (totalIn - totalOut) : null),
      alerts: [...new Map(day.vitals.flatMap(v => checkAlerts(v)).map(a => [a.type, a])).values()],
      peakNews2: day.vitals.length ? Math.max(...day.vitals.map(v => calcNEWS2(v))) : null,
      hasEvents: day.vitals.length || day.labs.length || day.orders.length || day.notes.length || day.io.length
    };
  });
}

function rangeStr(r, unit){
  if(!r) return '-';
  return r[0]===r[1] ? `${r[0]}${unit||''}` : `${r[0]}-${r[1]}${unit||''}`;
}

      `}
      ${shiftBlockHtml(d)}
    </div>`).join('')}</div>`;
}

function renderSummaryTab(el, p, db){
  const summaries = (db.summaries||[]).filter(s=>s.patientId===p.id).sort((a,b)=>b.time-a.time);
  const latest = summaries[0];
  const older = summaries.slice(1);
  const olderHtml = older.map(s => `
    <details style="margin-bottom:10px;">
      <summary class="muted" style="cursor:pointer;">${new Date(s.time).toLocaleString(lang)} - ${formatCreatedBy(s.createdBy)}</summary>
      <div style="margin-top:10px;">${dayTimelineHtml(s.days)}</div>
    </details>`).join('');
  el.innerHTML = `
    <div class="warn-banner">${t('summaryDisclaimer')}</div>
    <div class="card">
      <button onclick="generateSummary('${p.id}')" id="genSummaryBtn"><i class="ti ti-sparkles"></i> ${t('generateSummary')}</button>
      <div id="summaryStatus"></div>
    </div>
    ${latest ? `
      <div class="flex-between" style="margin-bottom:8px;"><h3 style="margin:0;">${t('summaryHistory')}</h3><span class="muted">${new Date(latest.time).toLocaleString(lang)}</span></div>
      ${dayTimelineHtml(latest.days)}
      ${older.length ? `<h4 class="muted" style="margin-top:20px;">${t('summaryHistory')} (${older.length})</h4>${olderHtml}` : ''}
    ` : `<p class="muted">${t('noSummaryYet')}</p>`}
  `;
  const TWELVE_HOURS = 12*3600000;
  const lastTime = summaries[0] ? summaries[0].time : 0;
  if(Date.now() - lastTime >= TWELVE_HOURS && getAiConfig().apiKey && !window._autoSummaryRunning){
    window._autoSummaryRunning = true;
    document.getElementById('summaryStatus').innerHTML = `<p class="muted">${t('summaryLoading')}</p>`;
    generateSummary(p.id).finally(() => { window._autoSummaryRunning = false; });

function buildDayNarrativePrompt(days, p){
  const daysText = days.map(d => `Day ${d.dayIndex}${d.isAdmission?' (admission day)':''} (${d.dateLabel}): meds started: ${d.meds.join(', ')||'none'}; vitals BP ${rangeStr(d.bpSysRange)}, HR ${rangeStr(d.hrRange)}, Temp ${rangeStr(d.tempRange)}, SpO2 ${rangeStr(d.spo2Range)}, GCS ${rangeStr(d.gcsRange)}; peak NEWS2: ${d.peakNews2??'n/a'}; rule-based alerts triggered: ${d.alerts.map(a=>a.type+'('+a.level+')').join(', ')||'none'}; labs: ${d.labs.join('; ')||'none'}; fluid balance: ${d.ioBalance!=null?d.ioBalance+'mL':'n/a'}; notes: ${d.notes.join('; ')||'none'}`).join('\n');
  const langName = lang==='ar'?'Arabic':lang==='tr'?'Turkish':lang==='fa'?'Persian':'English';
  return `You are writing ONE short highlight sentence (max 20 words) per ICU day, summarizing notable changes/trends only from the factual data given below. Do NOT diagnose, do NOT suggest treatment, do NOT recommend medication - only describe what the data shows (e.g. "BP improved after starting X", "fever persists"). Write in ${langName}. Patient context: ${p.age}yo ${p.gender}, diagnosis on file: ${p.diagnosis||'-'}.

${daysText}

Respond with ONLY a raw JSON object, no markdown, in this exact shape: {"narratives": {"0": "...", "1": "...", ...}} using the day numbers as keys. Skip a day only if it truly has no events.`;
}

async function generateSummary(patientId){
  const statusEl = document.getElementById('summaryStatus');
  const cfg = getAiConfig();
  if(!cfg.apiKey){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('noApiKey')}</p>`; return; }
  const db = patientDataCache;
  const p = patientsCache.find(x=>x.id===patientId);
  statusEl.innerHTML = `<p class="muted">${t('summaryLoading')}</p>`;
  try{
    const days = buildDayGroups(p, db);
    const prompt = buildDayNarrativePrompt(days, p);
    const text = await callAiTextOnly(prompt);
    const parsed = parseJsonObjectSafe(text);
    const narratives = parsed.narratives || {};
    days.forEach(d => { d.narrative = narratives[String(d.dayIndex)] || ''; });
    await fbDb.collection('summaries').add({ patientId, days, time: Date.now(), createdBy: currentActor() });
    statusEl.innerHTML = '';
  }catch(err){
    statusEl.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message||'').replace(/</g,'&lt;')}</div>`;
  }
}

/* ---------- التشخيص التمريضي المقترح بالذكاء الاصطناعي (NANDA-I) ----------
   دعم قرار فقط: الممرض هو من يقبل أو يعدّل أو يرفض كل اقتراح، ولا يُرسل اسم المريض
   ولا أي معرّف هوية للنموذج (بيانات سريرية مجهولة الهوية فقط). كل قرار يُسجَّل
   (مقبول / معدّل / مرفوض) لقياس نسبة قبول الاقتراحات في البحث. */
let dxPending = {};   // patientId -> اقتراحات لم يُبتّ فيها بعد
let dxEditing = {};   // 'patientId:index' -> true أثناء التعديل
let dxBusy = false;

function dxScrub(text, p){
  let s = String(text || '');
  String(p.name || '').split(/\s+/).filter(w => w.length >= 3).forEach(w => { s = s.split(w).join('[X]'); });
  return s;
}
function dxAgo(time){ return (Math.round((Date.now() - time) / 360000) / 10) + 'h ago'; }

function buildNursingDxContext(p, db){
  const mine = col => (db[col] || []).filter(x => x.patientId === p.id).sort((a, b) => b.time - a.time);
  const vit = mine('vitals').slice(0, 4);
  if(!vit.length) return null;
  const lines = [];
  lines.push(`Patient: ${p.age || '?'} years, ${p.gender || '?'}. Medical diagnosis: ${dxScrub(p.diagnosis, p) || '-'}. Chronic: ${dxScrub(p.chronic, p) || '-'}. Allergies: ${dxScrub(p.allergies, p) || '-'}. Past history: ${dxScrub(p.pastHistory, p) || '-'}. Home medications: ${dxScrub(p.homeMeds, p) || '-'}.`);
  lines.push('Vital signs (newest first):');
  vit.forEach(v => {
    let news = '';
    try{ news = ', NEWS2 ' + calcNEWS2(v); }catch(e){}
    lines.push(`- ${dxAgo(v.time)}: BP ${v.bp_sys}/${v.bp_dia}, HR ${v.pulse}, Temp ${v.temp}, SpO2 ${v.spo2}%, RR ${v.rr}${v.gcs_total != null ? ', GCS ' + v.gcs_total : ''}${news}`);
  });
  const labs = mine('labs').slice(0, 10);
  if(labs.length){
    lines.push('Latest labs:');
    labs.forEach(l => lines.push(`- ${dxScrub(l.testType, p)}: ${dxScrub(l.value, p)} (${dxAgo(l.time)})`));
  }
  const vent = mine('ventilator')[0];
  if(vent){
    if(vent.event === 'disconnect') lines.push('Ventilator: disconnected (not mechanically ventilated now).');
    else lines.push(`Ventilator: mode ${vent.mode || '-'}, FiO2 ${vent.fio2 ?? '-'}, PEEP ${vent.peep ?? '-'}, Vt ${vent.tidalVolume ?? '-'}, set RR ${vent.setRR ?? '-'}, PIP ${vent.pip ?? '-'}, Pplat ${vent.plateauPressure ?? '-'}${vent.airwayType ? ', airway ' + vent.airwayType : ''}.`);
  }
  const dayAgo = Date.now() - 24 * 3600000;
  const io = mine('io').filter(x => x.time >= dayAgo);
  if(io.length){
    const inMl = io.filter(x => x.direction === 'intake').reduce((s, x) => s + Number(x.amount || 0), 0);
    const outMl = io.filter(x => x.direction === 'output').reduce((s, x) => s + Number(x.amount || 0), 0);
    lines.push(`Intake/output last 24h: intake ${inMl} mL, output ${outMl} mL, balance ${inMl - outMl} mL.`);
  }
  const meds = mine('orders').filter(o => o.status === 'pending').map(o => o.medName).filter(Boolean);
  if(meds.length) lines.push('Active medication orders (names only): ' + meds.join(', ') + '.');
  const notes = mine('notes').slice(0, 3).map(n => '- ' + dxScrub(String(n.text || '').slice(0, 200), p)).filter(x => x.length > 2);
  if(notes.length) lines.push('Recent nursing notes:\n' + notes.join('\n'));
  return lines.join('\n');
}

function buildNursingDxPrompt(p, db){
  const ctx = buildNursingDxContext(p, db);
  if(!ctx) return null;
  const langName = lang === 'ar' ? 'Arabic' : lang === 'tr' ? 'Turkish' : lang === 'fa' ? 'Persian' : 'English';
  return `You are a nursing-informatics assistant supporting an ICU nurse. Based ONLY on the de-identified data below, propose 3 to 5 candidate NANDA-I nursing diagnoses, ranked by priority for the current shift.
Rules:
- Use only the data provided. Never invent values. If the data are insufficient for a diagnosis, do not propose it.
- Nursing diagnoses only (standard NANDA-I labels, for example "Ineffective airway clearance" or "Risk for infection"). Do NOT give medical diagnoses, drug names, doses, or medical orders.
- Every defining characteristic must quote a value or finding that appears in the data.
- Interventions must be nursing actions (monitoring, positioning, hygiene, safety, education, escalation to the physician when criteria are met). Expected outcomes must be measurable (NOC style).
- Write label, relatedFactors, definingCharacteristics, expectedOutcomes, interventions and rationale in ${langName}. Keep labelEn as the standard English NANDA-I label.
- Respond with ONLY a raw JSON object, no markdown, in this exact shape: {"diagnoses":[{"label":"","labelEn":"","urgency":"high|medium|low","relatedFactors":[""],"definingCharacteristics":[""],"expectedOutcomes":[""],"interventions":[""],"rationale":""}]}

DATA:
${ctx}`;
}

function dxCleanList(v){
  return (Array.isArray(v) ? v : []).map(x => String(x || '').trim()).filter(Boolean).slice(0, 6);
}
function dxSanitize(d, i){
  const urg = ['high', 'medium', 'low'].includes(d.urgency) ? d.urgency : 'medium';
  return {
    label: String(d.label || '').trim().slice(0, 160), labelEn: String(d.labelEn || '').trim().slice(0, 160),
    urgency: urg, priority: i + 1,
    relatedFactors: dxCleanList(d.relatedFactors), definingCharacteristics: dxCleanList(d.definingCharacteristics),
    expectedOutcomes: dxCleanList(d.expectedOutcomes), interventions: dxCleanList(d.interventions),
    rationale: String(d.rationale || '').trim().slice(0, 400)
  };
}

async function dxSuggest(pid){
  const statusEl = document.getElementById('dxStatus');
  const btn = document.getElementById('dxSuggestBtn');
  const cfg = getAiConfig();
  if(!cfg.apiKey){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('noApiKey')}</p>`; return; }
  if(dxBusy) return;
  const p = patientsCache.find(x => x.id === pid);
  const prompt = buildNursingDxPrompt(p, patientDataCache);
  if(!prompt){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${t('dxNoData')}</p>`; return; }
  dxBusy = true; if(btn) btn.disabled = true;
  statusEl.innerHTML = `<p class="muted">${t('dxLoading')}</p>`;
  try{
    const text = await callAiTextOnly(prompt, 4000);
    const parsed = parseJsonObjectSafe(text);
    const arr = (Array.isArray(parsed.diagnoses) ? parsed.diagnoses : []).slice(0, 5).map(dxSanitize).filter(d => d.label);
    if(!arr.length) throw new Error('EMPTY_RESPONSE');
    dxPending[pid] = arr; dxEditing = {};
    render();
  }catch(err){
    const net = /Failed to fetch|NetworkError|Load failed/i.test(err.message || '');
    statusEl.innerHTML = net
      ? `<div class="alert-box">${t('dxNetErr')}</div>`
      : `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message || '').replace(/</g, '&lt;')}</div>`;
  }finally{
    dxBusy = false; if(btn) btn.disabled = false;
  }
}

function dxLinesVal(id){
  const el = document.getElementById(id);
  return el ? el.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8) : [];
}
function dxListHtml(label, arr){
  if(!arr || !arr.length) return '';
  return `<div style="margin-top:8px;"><div class="muted" style="font-size:12.5px;font-weight:600;">${label}</div><ul style="margin:4px 0 0;padding-inline-start:20px;">${arr.map(x => `<li>${String(x).replace(/</g, '&lt;')}</li>`).join('')}</ul></div>`;
}
function dxUrgBadge(u){
  const map = { high: ['crit', 'dxUrgHigh'], medium: ['med', 'dxUrgMed'], low: ['low', 'dxUrgLow'] };
  const m = map[u] || map.medium;
  return `<span class="badge ${m[0]}">${t(m[1])}</span>`;
}
function dxBody(s){
  return `
    ${s.rationale ? `<p class="muted" style="margin:6px 0 0;">${t('dxRationale')}: ${String(s.rationale).replace(/</g, '&lt;')}</p>` : ''}
    ${dxListHtml(t('dxRelated'), s.relatedFactors)}
    ${dxListHtml(t('dxDefining'), s.definingCharacteristics)}
    ${dxListHtml(t('dxOutcomes'), s.expectedOutcomes)}
    ${dxListHtml(t('dxInterventions'), s.interventions)}`;
}
function dxPendingCardHtml(pid, s, i){
  const key = pid + ':' + i;
  if(dxEditing[key]){
    const ta = (id, label, arr) => `<div class="field"><label>${label} <span class="muted">(${t('dxLinesHint')})</span></label><textarea id="${id}_${i}" rows="3">${(arr || []).join('\n').replace(/</g, '&lt;')}</textarea></div>`;
    return `<div class="card">
      <div class="field"><label>${t('dxLabel')}</label><input id="dxe_label_${i}" value="${String(s.label).replace(/"/g, '&quot;')}"></div>
      ${ta('dxe_rel', t('dxRelated'), s.relatedFactors)}
      ${ta('dxe_def', t('dxDefining'), s.definingCharacteristics)}
      ${ta('dxe_out', t('dxOutcomes'), s.expectedOutcomes)}
      ${ta('dxe_int', t('dxInterventions'), s.interventions)}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="dxDecide('${pid}', ${i}, 'edited')"><i class="ti ti-check"></i> ${t('dxSaveEdit')}</button>
        <button class="secondary" onclick="dxToggleEdit('${pid}', ${i}, false)">${t('dxCancel')}</button>
      </div>
      <div id="dxCardErr_${i}"></div>
    </div>`;
  }
  return `<div class="card">
    <div class="flex-between" style="gap:10px;align-items:flex-start;">
      <div><strong>${i + 1}. ${String(s.label).replace(/</g, '&lt;')}</strong>
        ${s.labelEn ? `<div class="muted" style="direction:ltr;text-align:start;font-size:12.5px;">${String(s.labelEn).replace(/</g, '&lt;')}</div>` : ''}</div>
      ${dxUrgBadge(s.urgency)}
    </div>
    ${dxBody(s)}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button onclick="dxDecide('${pid}', ${i}, 'accepted')"><i class="ti ti-check"></i> ${t('dxAccept')}</button>
      <button class="secondary" onclick="dxToggleEdit('${pid}', ${i}, true)"><i class="ti ti-edit"></i> ${t('dxEdit')}</button>
      <button class="secondary" onclick="dxDecide('${pid}', ${i}, 'rejected')"><i class="ti ti-x"></i> ${t('dxReject')}</button>
    </div>
    <div id="dxCardErr_${i}"></div>
  </div>`;
}
function dxToggleEdit(pid, i, on){ dxEditing[pid + ':' + i] = !!on; render(); }

async function dxDecide(pid, i, status){
  const list = dxPending[pid] || [];
  const s = list[i];
  if(!s) return;
  const item = { ...s };
  if(status === 'edited'){
    item.label = (document.getElementById('dxe_label_' + i).value || '').trim() || s.label;
    item.relatedFactors = dxLinesVal('dxe_rel_' + i);
    item.definingCharacteristics = dxLinesVal('dxe_def_' + i);
    item.expectedOutcomes = dxLinesVal('dxe_out_' + i);
    item.interventions = dxLinesVal('dxe_int_' + i);
  }
  const rec = {
    patientId: pid, label: item.label, labelEn: item.labelEn || '', urgency: item.urgency || 'medium', priority: item.priority || (i + 1),
    relatedFactors: item.relatedFactors || [], definingCharacteristics: item.definingCharacteristics || [],
    expectedOutcomes: item.expectedOutcomes || [], interventions: item.interventions || [], rationale: item.rationale || '',
    status, source: 'ai', aiOriginalLabel: s.label, provider: getAiConfig().provider || '', uiLang: lang,
    time: Date.now(), decidedBy: currentActor()
  };
  try{
    await fbDb.collection('nursingDx').add(rec);
    list.splice(i, 1); dxEditing = {};
    render();
  }catch(err){
    const el = document.getElementById('dxCardErr_' + i);
    if(el) el.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message || '').replace(/</g, '&lt;')}</div>`;
  }
}

async function dxSaveManual(pid){
  const label = (document.getElementById('dxm_label').value || '').trim();
  const errEl = document.getElementById('dxManualErr');
  if(!label) return;
  try{
    await fbDb.collection('nursingDx').add({
      patientId: pid, label, labelEn: '', urgency: document.getElementById('dxm_urg').value || 'medium', priority: 0,
      relatedFactors: dxLinesVal('dxm_rel'), definingCharacteristics: [], expectedOutcomes: dxLinesVal('dxm_out'),
      interventions: dxLinesVal('dxm_int'), rationale: '', status: 'accepted', source: 'manual',
      uiLang: lang, time: Date.now(), decidedBy: currentActor()
    });
    render();
  }catch(err){
    errEl.innerHTML = `<div class="alert-box" style="font-family:var(--font-mono);font-size:12px;direction:ltr;text-align:start;word-break:break-all;">${(err.message || '').replace(/</g, '&lt;')}</div>`;
  }
}
async function dxResolve(docId){
  try{
    await fbDb.collection('nursingDx').doc(docId).update({ status: 'resolved', resolvedAt: Date.now(), resolvedBy: currentActor() });
  }catch(err){ alert(err.message); }
}

      <div style="margin-top:10px;">

        <div class="field"><label>${t('dxPriority')}</label><select id="dxm_urg"><option value="high">${t('dxUrgHigh')}</option><option value="medium" selected>${t('dxUrgMed')}</option><option value="low">${t('dxUrgLow')}</option></select></div>
        <div class="field"><label>${t('dxRelated')} <span class="muted">(${t('dxLinesHint')})</span></label><textarea id="dxm_rel" rows="2"></textarea></div>

        <div class="field"><label>${t('dxInterventions')} <span class="muted">(${t('dxLinesHint')})</span></label><textarea id="dxm_int" rows="2"></textarea></div>

      </div>

    <h3>${t('dxHistoryTitle')}</h3>

}

  const rows = notes.map(n => `

        <span class="muted">${new Date(n.time).toLocaleString(lang)}</span>
      </div>

        n.fileMimeType && n.fileMimeType.startsWith('image/')
          ? `<a href="${n.fileData}" target="_blank"><img src="${n.fileData}" style="max-width:100%;max-height:260px;border-radius:8px;margin:6px 0;display:block;"></a>`
          : `<a href="${n.fileData}" download="${n.fileName||'attachment'}" class="secondary" style="display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;margin:6px 0;text-decoration:none;"><i class="ti ti-file-download"></i> ${n.fileName||t('attachedFile')}</a>`
      ) : ''}
      <div class="muted" style="font-size:12px;">${t('recordedBy')}: ${formatCreatedBy(n.createdBy)}</div>
    </div>`).join('');
  el.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <h3 style="margin:0;">${t('addNote')}</h3>
        <button class="secondary" onclick="onNoteMicClick(event)"><i class="ti ti-microphone"></i> ${t('dictateNote')}</button>
      </div>
      <div id="noteMicStatus"></div>
      <div class="grid" style="margin-top:10px;">
        <div class="field"><label>${t('noteType')}</label>
          <select id="n_type">
            <option value="doctorNote">${t('doctorNote')}</option>
            <option value="nurseNote">${t('nurseNote')}</option>
          </select>
        </div>
        <div class="field"><label>${t('urgencyLevel')}</label>
          <select id="n_urgent">
            <option value="0">${t('nonUrgent')}</option>
            <option value="1">${t('urgent')}</option>
          </select>
        </div>
      </div>
      <div class="field"><label>${t('noteText')}</label><textarea id="n_text" rows="3"></textarea></div>
      <button class="secondary" id="n_voiceBtn" onclick="toggleNoteVoiceRecording()"><i class="ti ti-microphone-2"></i> ${t('recordVoiceNote')}</button>
      <div id="n_voiceStatus" class="muted" style="font-size:12px;margin-top:4px;"></div>
      <div class="field" style="margin-top:10px;"><label>${t('attachFileOrImage')}</label>
        <input type="file" id="n_file" accept="image/*,.pdf,.doc,.docx" onchange="onNoteFileSelected(this)">
      </div>
      <div id="n_fileStatus" class="muted" style="font-size:12px;margin-top:4px;"></div>
      <button style="margin-top:10px;" onclick="saveNote('${p.id}')">${t('save')}</button>
    </div>
    ${rows || `<p class="muted">${t('noData')}</p>`}
  `;
}

let currentNoteRecorder = null, currentNoteAudioBase64 = null;
async function toggleNoteVoiceRecording(){
  const btn = document.getElementById('n_voiceBtn');
  const statusEl = document.getElementById('n_voiceStatus');
  if(currentNoteRecorder && currentNoteRecorder.state === 'recording'){
    currentNoteRecorder.stop();
    return;
  }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(err){ statusEl.textContent = err.message; return; }
  const chunks = [];
  currentNoteRecorder = new MediaRecorder(stream);
  currentNoteRecorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  currentNoteRecorder.onstop = async () => {
    stream.getTracks().forEach(t=>t.stop());
    btn.innerHTML = `<i class="ti ti-microphone-2"></i> ${t('recordVoiceNote')}`;
    try{
      const base64 = await blobToBase64(new Blob(chunks, { type:'audio/webm' }));
      if(base64.length >= 900000){ statusEl.textContent = t('fileSizeWarning'); return; }
      currentNoteAudioBase64 = base64;
      statusEl.innerHTML = `<i class="ti ti-circle-check" style="color:var(--brand);"></i> ${t('voiceNoteAttached')}`;
    }catch(err){ statusEl.textContent = err.message; }
  };
  currentNoteRecorder.start();
  btn.innerHTML = `<i class="ti ti-player-stop-filled" style="color:var(--danger);"></i> ${t('listening')}`;
  statusEl.textContent = '';
}
let currentNoteFileData = null, currentNoteFileName = null, currentNoteFileMime = null;
async function onNoteFileSelected(input){
  const statusEl = document.getElementById('n_fileStatus');
  const file = input.files[0];
  if(!file) return;
  statusEl.textContent = t('extracting');
  try{
    let dataUrl;
    if(file.type.startsWith('image/')){
      const compressed = await compressImageToDataURL(file, 900);
      dataUrl = compressed.dataUrl;
    }else{
      dataUrl = await fileToBase64(file);
    }
    if(dataUrl.length >= 900000){
      statusEl.textContent = t('fileSizeWarning');
      input.value = '';
      return;
    }
    currentNoteFileData = dataUrl;
    currentNoteFileName = file.name;
    currentNoteFileMime = file.type;
    statusEl.innerHTML = `<i class="ti ti-circle-check" style="color:var(--brand);"></i> ${file.name}`;
  }catch(err){
    statusEl.textContent = err.message;
  }
}
async function saveNote(patientId){
  const noteTextForPush = document.getElementById('n_text').value;
  const noteUrgentForPush = document.getElementById('n_urgent').value === '1';
  await fbDb.collection('notes').add({
    patientId, noteType: document.getElementById('n_type').value, text: document.getElementById('n_text').value,
    urgent: document.getElementById('n_urgent').value === '1',
    audioData: currentNoteAudioBase64 || null,
    fileData: currentNoteFileData || null, fileName: currentNoteFileName || null, fileMimeType: currentNoteFileMime || null,
    time: Date.now(), createdBy: currentActor()
  });
  currentNoteAudioBase64 = null;
  currentNoteFileData = null; currentNoteFileName = null; currentNoteFileMime = null;
  const ptn = patientsCache.find(x => x.id === patientId);
  sendPush(ptn, noteUrgentForPush ? t('urgentNotifTitle') : t('newNoteNotifTitle'), (ptn ? ptn.name : '') + ': ' + noteTextForPush.slice(0, 60), 'tabNotes', noteUrgentForPush);
}

async function onNoteMicClickCloud(btn){
  const statusEl = document.getElementById('noteMicStatus');
  const label = () => { if(btn) btn.innerHTML = `<i class="ti ti-microphone"></i> ${t('dictateNote')}`; };
  if(cloudSttSession){
    const sess = cloudSttSession; cloudSttSession = null; label();
    statusEl.innerHTML = `<p class="muted">${sttM('busy')}</p>`;
    try{
      const blob = await sess.stop();
      const text = await cloudTranscribe(blob);
      if(!text){ statusEl.innerHTML = `<p class="muted" style="color:var(--warning);">${sttM('fail')}</p>`; return; }
      const ta = document.getElementById('n_text'); if(ta) ta.value = (ta.value ? ta.value + ' ' : '') + text;
      statusEl.innerHTML = '';
    }catch(err){
      const m = err.message === 'NO_STT_KEY' ? sttM('noKey') : sttM('fail');
      statusEl.innerHTML = `<p class="muted" style="color:var(--danger);">${m}</p><p class="muted" style="font-family:var(--font-mono);font-size:11px;direction:ltr;">${String(err.message||'').replace(/</g,'&lt;')}</p>`;
    }
    return;
  }
  try{
    cloudSttSession = await cloudSttStart();
    if(btn) btn.innerHTML = `<i class="ti ti-player-stop"></i> ${t('stopListening')}`;
    statusEl.innerHTML = `<p class="muted"><i class="ti ti-microphone" style="color:var(--danger);"></i> ${sttM('rec')}</p>`;
  }catch(err){
    cloudSttSession = null;
    statusEl.innerHTML = `<p class="muted" style="color:var(--danger);">${sttM('perm')}</p><p class="muted" style="font-family:var(--font-mono);font-size:11px;direction:ltr;">${(err.name||'') + ': ' + String(err.message||'').replace(/</g,'&lt;')}</p>`;
  }
}
function onNoteMicClick(ev){
  if(sttNeedsCloud()){ onNoteMicClickCloud(ev && (ev.currentTarget || ev.target.closest('button'))); return; }
  const statusEl = document.getElementById('noteMicStatus');
  startVoiceCapture(currentPatientId, 'notes',
    (transcript) => {
      const textarea = document.getElementById('n_text');
      textarea.value = (textarea.value ? textarea.value + ' ' : '') + transcript;
    },
    (err) => {
      statusEl.innerHTML = `<p class="muted" style="color:var(--danger);">${err==='NOT_SUPPORTED' ? t('notSupported') : t('micError')}</p><p class="muted" style="font-family:var(--font-mono);font-size:11px;direction:ltr;">lang=${SPEECH_LANG_MAP[lang]} error=${err}</p>`;
    },
    () => { statusEl.innerHTML = `<p class="muted"><i class="ti ti-microphone" style="color:var(--danger);"></i> ${t('listening')}</p>`; },
    (warning) => { statusEl.innerHTML += `<p class="muted" style="font-family:var(--font-mono);font-size:11px;direction:ltr;color:var(--warning);">audio file: ${warning.replace(/</g,'&lt;')}</p>`; }
  );
}

/* ---------- بدء التشغيل ---------- */
document.documentElement.dir = I18N[lang].dir;
document.documentElement.lang = lang;
document.getElementById('langSwitch').value = lang;

/* استعادة جلسة الدخول تلقائيًا لو المستخدم كان مسجّل دخول سابقًا على هذا الجهاز/المتصفح */
if(FIREBASE_READY){
  fbAuth.onAuthStateChanged(async (user) => {
    if(user){
      try{
        const profileDoc = await fbDb.collection('users').doc(user.uid).get();
        if(profileDoc.exists){
          const profile = profileDoc.data();
          currentUser = { id: user.uid, role: profile.role, name: profile.name || profile.username, username: profile.username };
        }
      }catch(err){ console.warn('session restore failed:', err.message); }
    }
    render();
  });
}
